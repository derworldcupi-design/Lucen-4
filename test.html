<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUCEN Test</title>
</head>
<body>
  <h1>LUCEN Verbindungstest</h1>

  <button id="test">OpenAI testen</button>

  <pre id="result">Noch nicht getestet.</pre>

  <script>
    document.getElementById("test").addEventListener("click", async () => {
      const result = document.getElementById("result");
      result.textContent = "Teste...";

      try {
        const response = await fetch("/.netlify/functions/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: "Antworte nur mit: LUCEN funktioniert."
          })
        });

        const data = await response.json();

        result.textContent =
          "HTTP " + response.status + "\n\n" +
          JSON.stringify(data, null, 2);

      } catch (error) {
        result.textContent =
          "Browser-Fehler:\n" + error.message;
      }
    });
  </script>
</body>
</html>
