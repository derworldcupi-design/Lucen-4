<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>LUCEN // PERSONAL INTELLIGENCE SYSTEM</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#01050a;
  color:#bcefff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}

body{
  position:relative;
  background:
    radial-gradient(circle at 50% 43%,rgba(0,210,255,.10),transparent 32%),
    radial-gradient(circle at 50% 100%,rgba(0,100,255,.10),transparent 48%),
    #01050a;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

#stars{z-index:0}
#world{z-index:1}
#fx{z-index:2;pointer-events:none}

.scanlines{
  position:absolute;
  inset:0;
  z-index:40;
  pointer-events:none;
  opacity:.10;
  background:repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 3px,
    rgba(120,220,255,.10) 4px
  );
}

.vignette{
  position:absolute;
  inset:0;
  z-index:41;
  pointer-events:none;
  background:radial-gradient(
    ellipse at center,
    transparent 35%,
    rgba(0,0,0,.78) 100%
  );
}

.noise{
  position:absolute;
  inset:0;
  z-index:42;
  pointer-events:none;
  opacity:.035;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
}

.hud{
  position:absolute;
  inset:0;
  z-index:10;
  pointer-events:none;
  padding:
    max(12px,env(safe-area-inset-top))
    12px
    max(10px,env(safe-area-inset-bottom));
}

.topbar{
  position:absolute;
  top:max(12px,env(safe-area-inset-top));
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
}

.logo{
  width:40px;
  height:40px;
  border:1px solid rgba(100,230,255,.65);
  border-radius:50%;
  display:grid;
  place-items:center;
  box-shadow:
    0 0 15px rgba(0,200,255,.25),
    inset 0 0 14px rgba(0,200,255,.15);
  animation:logoPulse 2.4s infinite;
}

.logo:before{
  content:"";
  width:18px;
  height:18px;
  border:1px solid rgba(130,245,255,.8);
  border-radius:50%;
}

.logo:after{
  content:"";
  position:absolute;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#c4faff;
  box-shadow:0 0 15px #2bdcff;
}

@keyframes logoPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.07)}
}

.title{
  color:#e0fbff;
  font-size:19px;
  font-weight:800;
  letter-spacing:5px;
  text-shadow:0 0 12px rgba(50,220,255,.35);
}

.subtitle{
  margin-top:2px;
  font-size:7px;
  letter-spacing:2.4px;
  opacity:.48;
}

.status{
  text-align:right;
  font-size:8px;
  letter-spacing:1.7px;
  line-height:15px;
}

.statusDot{
  display:inline-block;
  width:6px;
  height:6px;
  border-radius:50%;
  background:#4affcf;
  box-shadow:0 0 11px #4affcf;
  animation:statusPulse 1.1s infinite;
}

@keyframes statusPulse{
  50%{opacity:.25}
}

.corner{
  position:absolute;
  width:38px;
  height:38px;
  opacity:.4;
}

.corner.tl{
  top:70px;
  left:12px;
  border-top:1px solid #5edfff;
  border-left:1px solid #5edfff;
}

.corner.tr{
  top:70px;
  right:12px;
  border-top:1px solid #5edfff;
  border-right:1px solid #5edfff;
}

.corner.bl{
  bottom:150px;
  left:12px;
  border-bottom:1px solid #5edfff;
  border-left:1px solid #5edfff;
}

.corner.br{
  bottom:150px;
  right:12px;
  border-bottom:1px solid #5edfff;
  border-right:1px solid #5edfff;
}

.coreArea{
  position:absolute;
  left:50%;
  top:43%;
  transform:translate(-50%,-50%);
  width:min(82vw,370px);
  aspect-ratio:1;
}

.coreGlow{
  position:absolute;
  inset:18%;
  border-radius:50%;
  background:radial-gradient(
    circle,
    rgba(0,230,255,.40),
    rgba(0,140,255,.12) 38%,
    transparent 70%
  );
  filter:blur(16px);
  animation:glow 1.4s ease-in-out infinite alternate;
}

@keyframes glow{
  from{transform:scale(.82);opacity:.45}
  to{transform:scale(1.18);opacity:1}
}

.coreRing{
  position:absolute;
  border-radius:50%;
  border:1px solid rgba(85,220,255,.22);
}

.r1{
  inset:3%;
  border-top-color:#65eaff;
  border-right-color:rgba(80,220,255,.05);
  animation:spin 18s linear infinite;
}

.r2{
  inset:8%;
  border-left-color:#3db8ff;
  border-bottom-color:rgba(60,180,255,.05);
  animation:spinReverse 13s linear infinite;
}

.r3{
  inset:15%;
  border-top-color:#b7f7ff;
  border-bottom-color:#1486bb;
  animation:spin 8s linear infinite;
}

.r4{
  inset:24%;
  border-left-color:#75efff;
  animation:spinReverse 5s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

@keyframes spinReverse{
  to{transform:rotate(-360deg)}
}

.tickRing{
  position:absolute;
  inset:0;
  border-radius:50%;
  animation:spin 30s linear infinite;
}

.tickRing:before,
.tickRing:after{
  content:"";
  position:absolute;
  left:50%;
  top:-2px;
  width:1px;
  height:11px;
  background:#6ceaff;
  box-shadow:0 0 8px #6ceaff;
}

.tickRing:after{
  top:auto;
  bottom:-2px;
}

.core{
  position:absolute;
  inset:34%;
  border-radius:50%;
  border:2px solid rgba(160,247,255,.9);
  background:radial-gradient(
    circle at 42% 38%,
    rgba(220,255,255,.9),
    rgba(20,210,255,.48) 13%,
    rgba(0,80,130,.25) 42%,
    rgba(0,10,20,.9) 72%
  );
  box-shadow:
    0 0 14px #36dfff,
    0 0 40px rgba(0,200,255,.55),
    0 0 90px rgba(0,100,255,.22),
    inset 0 0 30px rgba(100,240,255,.45);
  animation:coreBeat 1.5s ease-in-out infinite;
}

@keyframes coreBeat{
  0%,100%{transform:scale(.95)}
  50%{transform:scale(1.07)}
}

.core:before{
  content:"";
  position:absolute;
  inset:17%;
  border:1px solid rgba(190,250,255,.8);
  border-radius:50%;
  animation:spinReverse 4s linear infinite;
}

.core:after{
  content:"";
  position:absolute;
  left:15%;
  right:15%;
  top:50%;
  height:1px;
  background:#bdfaff;
  box-shadow:0 0 12px #4be5ff;
}

.coreText{
  position:absolute;
  z-index:3;
  inset:0;
  display:grid;
  place-items:center;
  text-align:center;
  font-size:7px;
  letter-spacing:2px;
  color:#dfffff;
  text-shadow:0 0 12px #27ddff;
}

.coreText strong{
  display:block;
  font-size:15px;
  letter-spacing:4px;
}

.mode{
  position:absolute;
  left:50%;
  top:calc(43% + min(41vw,185px));
  transform:translateX(-50%);
  width:240px;
  text-align:center;
  font-family:monospace;
  font-size:8px;
  letter-spacing:2px;
  opacity:.65;
}

.progress{
  position:absolute;
  left:50%;
  top:calc(43% + min(46vw,208px));
  transform:translateX(-50%);
  width:min(290px,76vw);
}

.progressHead{
  display:flex;
  justify-content:space-between;
  margin-bottom:6px;
  font-family:monospace;
  font-size:7px;
  letter-spacing:1.5px;
  opacity:.7;
}

.progressBar{
  height:3px;
  border-radius:5px;
  overflow:hidden;
  background:rgba(100,220,255,.10);
}

.progressFill{
  height:100%;
  width:0%;
  background:#74ecff;
  box-shadow:0 0 13px #35dcff;
  transition:width .22s ease;
}

.tiles{
  position:absolute;
  left:12px;
  right:12px;
  bottom:114px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
}

.tile{
  position:relative;
  min-height:45px;
  padding:6px 5px;
  border:1px solid rgba(100,220,255,.14);
  background:rgba(0,15,27,.53);
  backdrop-filter:blur(9px);
  -webkit-backdrop-filter:blur(9px);
  overflow:hidden;
}

.tile.active{
  border-color:rgba(100,235,255,.7);
  box-shadow:
    0 0 18px rgba(0,200,255,.16),
    inset 0 0 15px rgba(0,200,255,.06);
}

.tile.active:before{
  content:"";
  position:absolute;
  left:-100%;
  top:0;
  width:100%;
  height:1px;
  background:#76eeff;
  box-shadow:0 0 10px #4adfff;
  animation:tileScan .7s linear infinite;
}

@keyframes tileScan{
  to{left:100%}
}

.tileName{
  font-family:monospace;
  font-size:6px;
  letter-spacing:1.3px;
  opacity:.42;
}

.tileValue{
  margin-top:4px;
  font-family:monospace;
  font-size:8px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.activity{
  position:absolute;
  left:12px;
  right:12px;
  bottom:64px;
  height:42px;
  overflow:hidden;
  font-family:monospace;
  font-size:7px;
  line-height:12px;
  opacity:.58;
  text-shadow:0 0 8px rgba(80,220,255,.5);
}

.logLine{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat{
  position:absolute;
  left:12px;
  right:12px;
  top:82px;
  max-height:125px;
  overflow:hidden;
  pointer-events:none;
}

.message{
  max-width:92%;
  margin-bottom:5px;
  padding:7px 9px;
  border-left:2px solid rgba(70,220,255,.55);
  background:rgba(0,18,30,.50);
  backdrop-filter:blur(7px);
  font-size:11px;
  line-height:15px;
  animation:messageIn .25s ease-out;
}

.message.user{
  margin-left:auto;
  border-left:0;
  border-right:2px solid rgba(100,245,210,.5);
  text-align:right;
}

@keyframes messageIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}

.inputArea{
  position:absolute;
  left:9px;
  right:9px;
  bottom:max(7px,env(safe-area-inset-bottom));
  display:flex;
  gap:6px;
  pointer-events:auto;
}

.input{
  min-width:0;
  flex:1;
  height:47px;
  padding:0 13px;
  border-radius:12px;
  border:1px solid rgba(100,220,255,.28);
  outline:none;
  background:rgba(1,13,23,.87);
  color:#dcfbff;
  font-size:14px;
  box-shadow:
    inset 0 0 15px rgba(0,160,255,.04),
    0 0 15px rgba(0,150,255,.07);
}

.input::placeholder{
  color:rgba(180,230,245,.32);
}

.btn{
  width:47px;
  height:47px;
  flex:none;
  border-radius:12px;
  border:1px solid rgba(100,220,255,.32);
  background:rgba(1,17,29,.90);
  color:#bff6ff;
  font-size:18px;
}

.btn:active{
  transform:scale(.92);
}

.voice.live{
  border-color:#4affd1;
  background:rgba(0,100,85,.35);
  box-shadow:0 0 30px rgba(50,255,210,.28);
  animation:voicePulse .9s infinite;
}

@keyframes voicePulse{
  50%{box-shadow:0 0 45px rgba(50,255,210,.52)}
}

.processing{
  position:absolute;
  inset:0;
  z-index:35;
  display:none;
  place-items:center;
  pointer-events:none;
}

.processing.show{
  display:grid;
}

.processingCenter{
  width:220px;
  text-align:center;
}

.processingTitle{
  font-size:25px;
  font-weight:700;
  letter-spacing:6px;
  text-shadow:0 0 20px #2ddcff;
}

.processingSub{
  margin-top:9px;
  font-family:monospace;
  font-size:7px;
  letter-spacing:2px;
  opacity:.65;
}

.pulseCircle{
  width:85px;
  height:85px;
  margin:0 auto 18px;
  border-radius:50%;
  border:1px solid rgba(90,230,255,.45);
  box-shadow:
    0 0 20px rgba(0,210,255,.15),
    inset 0 0 20px rgba(0,210,255,.08);
  animation:processingPulse 1s infinite;
}

@keyframes processingPulse{
  0%{transform:scale(.8);opacity:.35}
  50%{transform:scale(1.08);opacity:1}
  100%{transform:scale(.8);opacity:.35}
}

.hit{
  position:absolute;
  z-index:25;
  width:7px;
  height:7px;
  border-radius:50%;
  border:1px solid #c4faff;
  box-shadow:0 0 18px #24ddff;
  pointer-events:none;
}

.flash{
  position:absolute;
  inset:0;
  z-index:34;
  pointer-events:none;
  background:rgba(80,230,255,.12);
  opacity:0;
}

.flash.go{
  animation:flash .35s ease-out;
}

@keyframes flash{
  0%{opacity:1}
  100%{opacity:0}
}

@media(max-width:390px){
  .title{font-size:17px}
  .tiles{bottom:113px;gap:4px}
  .tile{min-height:42px;padding:5px 4px}
  .tileValue{font-size:7px}
  .chat{top:78px}
}

@media(min-height:850px){
  .chat{top:95px}
}
</style>
</head>

<body>

<canvas id="stars"></canvas>
<canvas id="world"></canvas>

<div class="scanlines"></div>

<div class="noise"></div>

<div class="hud">

  <div class="topbar">

    <div class="brand">

    <div class="coreRing r1"></div>

      <div class="tileName">PROCESSING</div>

    </div>

      <div class="tileName">NETWORK</div>

    </div>

<script>
/* =========================================================
   DOM
   ========================================================= */

const starsCanvas =
  document.getElementById("stars");

const worldCanvas =
  document.getElementById("world");

const fxCanvas =
  document.getElementById("fx");

const sc =
  starsCanvas.getContext("2d");

const wc =
  worldCanvas.getContext("2d");

const fc =
  fxCanvas.getContext("2d");

const input =
  document.getElementById("input");

const send =
  document.getElementById("send");

const voice =
  document.getElementById("voice");

const chat =
  document.getElementById("chat");

const activity =
  document.getElementById("activity");

const processing =
  document.getElementById("processing");

const processingTitle =
  document.getElementById("processingTitle");

const processingSub =
  document.getElementById("processingSub");

const progressFill =
  document.getElementById("progressFill");

const percent =
  document.getElementById("percent");

const operation =
  document.getElementById("operation");

const mode =
  document.getElementById("mode");

const flash =
  document.getElementById("flash");

const tileAnalysis =
  document.getElementById("tileAnalysis");

const tileWeb =
  document.getElementById("tileWeb");

const tileSources =
  document.getElementById("tileSources");

const tileProcess =
  document.getElementById("tileProcess");

const analysisValue =
  document.getElementById("analysisValue");

const webValue =
  document.getElementById("webValue");

const sourceValue =
  document.getElementById("sourceValue");

const processValue =
  document.getElementById("processValue");


/* =========================================================
   CANVAS
   ========================================================= */

let W=innerWidth;
let H=innerHeight;

function resize(){

  W=innerWidth;
  H=innerHeight;

  for(const canvas of [
    starsCanvas,
    worldCanvas,
    fxCanvas
  ]){

    canvas.width=
      W*devicePixelRatio;

    canvas.height=
      H*devicePixelRatio;

    canvas.style.width=
      W+"px";

    canvas.style.height=
      H+"px";

    const ctx=
      canvas===starsCanvas
        ? sc
        : canvas===worldCanvas
          ? wc
          : fc;

    ctx.setTransform(
      devicePixelRatio,
      0,
      0,
      devicePixelRatio,
      0,
      0
    );

  }

}

addEventListener(
  "resize",
  resize
);

resize();


/* =========================================================
   STAR FIELD
   ========================================================= */

const stars=[];

function buildStars(){

  stars.length=0;

  for(let i=0;i<220;i++){

    stars.push({
      x:Math.random()*W,
      y:Math.random()*H,
      r:.15+Math.random()*1.25,
      speed:.002+Math.random()*.012,
      phase:Math.random()*Math.PI*2
    });

  }

}

buildStars();

function drawStars(){

  sc.clearRect(
    0,
    0,
    W,
    H
  );

  for(const s of stars){

    s.phase+=s.speed;

    const alpha=
      .12+
      Math.abs(Math.sin(s.phase))*.5;

    sc.globalAlpha=alpha;

    sc.beginPath();

    sc.arc(
      s.x,
      s.y,
      s.r,
      0,
      Math.PI*2
    );

    sc.fillStyle="#a8eaff";
    sc.fill();

  }

  sc.globalAlpha=1;

}


/* =========================================================
   GLOBAL INTELLIGENCE MAP
   ========================================================= */

let radarAngle=0;

const targets=[];

function addTarget(){

  const cx=W/2;
  const cy=H*.43;

  const radius=
    Math.min(W*.43,H*.27);

  const a=
    Math.random()*Math.PI*2;

  const r=
    Math.sqrt(Math.random())*radius;

  targets.push({
    x:cx+Math.cos(a)*r,
    y:cy+Math.sin(a)*r*.58,
    pulse:Math.random()*Math.PI*2,
    life:1
  });

  if(targets.length>18)
    targets.shift();

}

function drawWorld(){

  wc.clearRect(
    0,
    0,
    W,
    H
  );

  const cx=W/2;
  const cy=H*.43;

  const radius=
    Math.min(W*.43,H*.27);

  wc.save();

  wc.translate(
    cx,
    cy
  );

  /* globe outline */

  wc.beginPath();

  wc.arc(
    0,
    0,
    radius,
    0,
    Math.PI*2
  );

  wc.strokeStyle=
    "rgba(70,210,255,.18)";

  wc.lineWidth=1;
  wc.stroke();


  /* latitude */

  for(let i=-4;i<=4;i++){

    const y=
      i*radius*.20;

    wc.beginPath();

    wc.ellipse(
      0,
      y,
      radius,
      Math.max(
        2,
        radius*.18
      ),
      0,
      0,
      Math.PI*2
    );

    wc.strokeStyle=
      "rgba(70,210,255,.10)";

    wc.stroke();

  }


  /* longitude */

  for(let i=-5;i<=5;i++){

    const x=
      i*radius*.18;

    wc.beginPath();

    wc.ellipse(
      x,
      0,
      Math.max(
        2,
        radius*.2
      ),
      radius,
      0,
      0,
      Math.PI*2
    );

    wc.strokeStyle=
      "rgba(70,210,255,.08)";

    wc.stroke();

  }


  /* horizontal scan lines */

  for(
    let y=-radius;
    y<=radius;
    y+=15
  ){

    wc.beginPath();

    wc.moveTo(
      -radius,
      y
    );

    wc.lineTo(
      radius,
      y
    );

    wc.strokeStyle=
      "rgba(80,220,255,.035)";

    wc.stroke();

  }

  /* radar */

  radarAngle+=.009;

  wc.save();

  wc.rotate(
    radarAngle
  );

  const gradient=
    wc.createLinearGradient(
      0,
      0,
      radius,
      0
    );

  gradient.addColorStop(
    0,
    "rgba(50,230,255,0)"
  );

  gradient.addColorStop(
    .65,
    "rgba(50,230,255,.04)"
  );

  gradient.addColorStop(
    1,
    "rgba(80,240,255,.26)"
  );

  wc.fillStyle=gradient;

  wc.beginPath();

  wc.moveTo(
    0,
    0
  );

  wc.arc(
    0,
    0,
    radius,
    -.35,
    .35
  );

  wc.closePath();

  wc.fill();

  wc.restore();

  wc.restore();


  /* targets */

  for(const t of targets){

    t.pulse+=.08;

    const pulse=
      1+
      Math.sin(t.pulse)*.45;

    wc.beginPath();

    wc.arc(
      t.x,
      t.y,
      2.2*pulse,
      0,
      Math.PI*2
    );

    wc.fillStyle=
      "rgba(120,245,255,.95)";

    wc.shadowBlur=15;
    wc.shadowColor="#27dcff";

    wc.fill();

    wc.shadowBlur=0;

    wc.beginPath();

    wc.arc(
      t.x,
      t.y,
      8+4*pulse,
      0,
      Math.PI*2
    );

    wc.strokeStyle=
      "rgba(60,220,255,.25)";

    wc.stroke();

  }

}


/* =========================================================
   CONNECTION LINES
   ========================================================= */

function drawConnections(){

  if(targets.length<2)
    return;

  for(let i=0;i<targets.length-1;i++){

    const a=targets[i];
    const b=targets[i+1];

    fc.beginPath();

    fc.moveTo(
      a.x,
      a.y
    );

    fc.lineTo(
      b.x,
      b.y
    );

    fc.strokeStyle=
      "rgba(50,210,255,.10)";

    fc.lineWidth=.7;

    fc.stroke();

  }

}


/* =========================================================
   DATA PACKETS
   ========================================================= */

const packets=[];

function spawnPacket(){

  if(!targets.length)
    return;

  const target=
    targets[
      Math.floor(
        Math.random()*targets.length
      )
    ];

  packets.push({
    x:W/2,
    y:H*.43,
    tx:target.x,
    ty:target.y,
    p:0,
    speed:.012+Math.random()*.025
  });

  if(packets.length>45)
    packets.shift();

}

function drawPackets(){

  for(
    let i=packets.length-1;
    i>=0;
    i--
  ){

    const p=packets[i];

    p.p+=p.speed;

    const ease=
      1-Math.pow(
        1-p.p,
        3
      );

    p.x=
      W/2+
      (p.tx-W/2)*ease;

    p.y=
      H*.43+
      (p.ty-H*.43)*ease;

    fc.beginPath();

    fc.arc(
      p.x,
      p.y,
      1.7,
      0,
      Math.PI*2
    );

    fc.fillStyle="#d5fbff";

    fc.shadowBlur=14;
    fc.shadowColor="#21ddff";

    fc.fill();

    fc.shadowBlur=0;

    if(p.p>=1)
      packets.splice(i,1);

  }

}

/* =========================================================
   AUDIO ENGINE
   ========================================================= */

let audioCtx=null;
let master=null;
let ambient=null;

function initAudio(){

  if(audioCtx){

    if(
      audioCtx.state==="suspended"
    ){

      audioCtx.resume();

    }

    return;

  }

  audioCtx=
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

  master=
    audioCtx.createGain();

  master.gain.value=.42;

  master.connect(
    audioCtx.destination
  );

  ambient=
    audioCtx.createGain();

  ambient.gain.value=.025;

  ambient.connect(
    master
  );

  const o1=
    audioCtx.createOscillator();

  const o2=
    audioCtx.createOscillator();

  const g=
    audioCtx.createGain();

  o1.type="sine";
  o2.type="triangle";

  o1.frequency.value=43;
  o2.frequency.value=86;

  g.gain.value=.12;

  o1.connect(g);
  o2.connect(g);

  g.connect(ambient);

  o1.start();
  o2.start();

}

function tone(
  frequency,
  duration=.12,
  type="sine",
  volume=.08,
  slide=0
){

  if(!audioCtx)
    return;

  const now=
    audioCtx.currentTime;

  const osc=
    audioCtx.createOscillator();

  const gain=
    audioCtx.createGain();

  const filter=
    audioCtx.createBiquadFilter();

  osc.type=type;

  osc.frequency.setValueAtTime(
    frequency,
    now
  );

  if(slide){

    osc.frequency.exponentialRampToValueAtTime(
      Math.max(
        25,
        frequency+slide
      ),
      now+duration
    );

  }

  filter.type="lowpass";

  filter.frequency.value=
    Math.min(
      10000,
      frequency*5
    );

  gain.gain.setValueAtTime(
    .0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    volume,
    now+.015
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now+duration
  );

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(master);

  osc.start(now);
  osc.stop(
    now+duration+.04
  );

}

function sweep(){

  if(!audioCtx)
    return;

  const now=
    audioCtx.currentTime;

  const osc=
    audioCtx.createOscillator();

  const gain=
    audioCtx.createGain();

  osc.type="sawtooth";

  osc.frequency.setValueAtTime(
    120,
    now
  );

  osc.frequency.exponentialRampToValueAtTime(
    2200,
    now+.5
  );

  gain.gain.setValueAtTime(
    .0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    .12,
    now+.05
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now+.5
  );

  osc.connect(gain);
  gain.connect(master);

  osc.start(now);
  osc.stop(
    now+.52
  );

}

/* =========================================================
   LUCEN BACKEND
   ========================================================= */

async function askLucen(
  message
){

  startSearchVisual();

  const lower=
    message.toLowerCase();

  const searchTerms=[
    "suche",
    "such",
    "internet",
    "web",
    "recherche",
    "recherchiere",
    "aktuell",
    "aktuelle",
    "aktuellen",
    "heute",
    "heutige",
    "jetzt",
    "news",
    "nachrichten",
    "preis",
    "preise",
    "wetter",
    "öffnungszeiten",
    "quelle",
    "quellen"
  ];

  const isSearch=
    searchTerms.some(
      word =>
        lower.includes(word)
    );

  if(isSearch){

    activate(
      tileWeb,
      "SEARCHING"
    );

  }

  try{

    const response=
      await fetch(
        "/.netlify/functions/lucen-v2",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            message
          })
        }
      );

    const data=
      await response.json();

    if(!response.ok){

      throw new Error(
        data?.error ||
        "LUCEN Backend Fehler"
      );

    }

    setProgress(
      91,
      "GENERATING RESPONSE"
    );

    mode.textContent=
      "RESPONSE SYNTHESIS";

    log(
      "Response synthesis active"
    );

    if(data?.analysis?.modules){

      for(
        const module
        of data.analysis.modules
      ){

        log(
          String(module)
        );

      }

    }

    finishSearchVisual();

    return(
      data?.reply ||
      "Verstanden."
    );

  }catch(error){

    console.error(
      "LUCEN:",
      error
    );

    errorSound();

    processingTitle.textContent=
      "ERROR";

    processingSub.textContent=
      error?.message ||
      "CONNECTION FAILURE";

    mode.textContent=
      "SYSTEM ERROR";

    setProgress(
      0,
      "ERROR"
    );

    log(
      "ERROR: "+
      (
        error?.message ||
        "Unknown"
      )
    );

    setTimeout(
      ()=>{
        processing.classList.remove(
          "show"
        );
      },
      1500
    );

    return(
      "LUCEN konnte die Anfrage gerade nicht verarbeiten."
    );

  }

}

/* =========================================================
   VOICE — REALTIME WEBRTC
   ========================================================= */

let pc=null;
let dc=null;
let remoteAudio=null;
let voiceStream=null;
let voiceActive=false;

async function startVoice(){

  initAudio();

  if(voiceActive){

    stopVoice();

    return;

  }

  try{

    addLog(
      "VOICE SYSTEM INITIALIZING"
    );

    voice.classList.add(
      "live"
    );

    voice.textContent=
      "●";

    voiceActive=true;

    mode.textContent=
      "VOICE SYSTEM ACTIVE";

    pc=
      new RTCPeerConnection();

    remoteAudio=
      document.createElement(
        "audio"
      );

    remoteAudio.autoplay=true;
    remoteAudio.playsInline=true;

    document.body.appendChild(
      remoteAudio
    );

    pc.ontrack=
      event=>{

        if(
          event.streams &&
          event.streams[0]
        ){

          remoteAudio.srcObject=
            event.streams[0];

          remoteAudio
            .play()
            .catch(
              ()=>{}
            );

        }

      };

    voiceStream=
      await navigator
        .mediaDevices
        .getUserMedia({
          audio:true
        });

    voiceStream
      .getTracks()
      .forEach(
        track=>{

          pc.addTrack(
            track,
            voiceStream
          );

        }
      );

    dc=
      pc.createDataChannel(
        "oai-events"
      );

    dc.onopen=
      ()=>{

        addLog(
          "VOICE CHANNEL CONNECTED"
        );

        tone(
          660,
          .12,
          "sine",
          .08,
          220
        );

      };

    dc.onmessage=
      event=>{

        try{

          const data=
            JSON.parse(
              event.data
            );

          if(
            data.type===
            "response.created"
          ){

            mode.textContent=
              "VOICE RESPONSE ACTIVE";

            log(
              "Voice response active"
            );

          }

          if(
            data.type===
            "response.done"
          ){

            mode.textContent=
              "VOICE READY";

            log(
              "Voice response complete"
            );

          }

        }catch{}

      };

    const offer=
      await pc.createOffer();

    await pc.setLocalDescription(
      offer
    );

    const response=
      await fetch(
        "/.netlify/functions/realtime",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/sdp"
          },
          body:offer.sdp
        }
      );

    if(!response.ok){

      const raw=
        await response.text();

      throw new Error(
        raw ||
        "Realtime connection failed"
      );

    }

    const answer=
      await response.text();

    await pc.setRemoteDescription({
      type:"answer",
      sdp:answer
    });

    addLog(
      "LUCEN VOICE ONLINE"
    );

    mode.textContent=
      "VOICE ONLINE";

  }catch(error){

    console.error(
      "VOICE:",
      error
    );

    errorSound();

    addLog(
      "VOICE ERROR: "+
      (
        error?.message ||
        "Unknown"
      )
    );

    stopVoice();

  }

}

function stopVoice(){

  voiceActive=false;

  voice.classList.remove(
    "live"
  );

  voice.textContent=
    "🎙";

  if(
    voiceStream
  ){

    voiceStream
      .getTracks()
      .forEach(
        track=>{
          try{
            track.stop();
          }catch{}
        }
      );

  }

  voiceStream=null;

  if(pc){

    pc.getSenders()
      .forEach(
        sender=>{
          try{
            sender.track?.stop();
          }catch{}
        }
      );

    try{
      pc.close();
    }catch{}

  }

  pc=null;
  dc=null;

  if(remoteAudio){

    remoteAudio.srcObject=null;

    try{
      remoteAudio.remove();
    }catch{}

  }

  remoteAudio=null;

  mode.textContent=
    "SYSTEM READY";

  addLog(
    "VOICE SYSTEM OFFLINE"
  );

}

voice.addEventListener(
  "click",
  startVoice
);
