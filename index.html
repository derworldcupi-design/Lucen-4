<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LUCEN // AI CORE</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02070d;
  color:#bcefff;
  font-family:
    -apple-system,BlinkMacSystemFont,
    "SF Pro Display","Segoe UI",sans-serif;
}

body{
  position:relative;
  background:
    radial-gradient(circle at 50% 45%,rgba(0,190,255,.09),transparent 38%),
    radial-gradient(circle at 50% 100%,rgba(0,110,255,.08),transparent 45%),
    #02070d;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

#stars{
  z-index:0;
}

#world{
  z-index:1;
}

#fx{
  z-index:2;
  pointer-events:none;
}

.scanlines{
  position:absolute;
  inset:0;
  z-index:20;
  pointer-events:none;
  opacity:.12;
  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      rgba(120,220,255,.08) 4px
    );
}

.vignette{
  position:absolute;
  inset:0;
  z-index:21;
  pointer-events:none;
  background:
    radial-gradient(
      ellipse at center,
      transparent 45%,
      rgba(0,0,0,.72) 100%
    );
}

.hud{
  position:absolute;
  inset:0;
  z-index:10;
  display:flex;
  flex-direction:column;
  padding:
    max(14px,env(safe-area-inset-top))
    14px
    max(14px,env(safe-area-inset-bottom));
  pointer-events:none;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  pointer-events:auto;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:40px;
  height:40px;
  border:1px solid rgba(100,220,255,.65);
  border-radius:50%;
  display:grid;
  place-items:center;
  box-shadow:
    0 0 15px rgba(0,200,255,.25),
    inset 0 0 12px rgba(0,200,255,.12);
  animation:logoPulse 2.5s infinite;
}

.logo::after{
  content:"";
  width:12px;
  height:12px;
  border-radius:50%;
  background:#8cecff;
  box-shadow:0 0 18px #28d9ff;
}

@keyframes logoPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.06)}
}

.title{
  font-size:20px;
  font-weight:700;
  letter-spacing:5px;
  color:#d9f9ff;
}

.subtitle{
  font-size:8px;
  letter-spacing:3px;
  opacity:.55;
  margin-top:3px;
}

.status{
  text-align:right;
  font-size:9px;
  letter-spacing:2px;
}

.statusDot{
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#46f6c5;
  box-shadow:0 0 12px #46f6c5;
  margin-right:5px;
  animation:statusPulse 1.2s infinite;
}

@keyframes statusPulse{
  50%{opacity:.3}
}

.coreArea{
  position:absolute;
  left:50%;
  top:43%;
  transform:translate(-50%,-50%);
  width:min(72vw,340px);
  aspect-ratio:1;
  pointer-events:none;
}

.coreGlow{
  position:absolute;
  inset:20%;
  border-radius:50%;
  background:radial-gradient(
    circle,
    rgba(0,220,255,.35),
    rgba(0,130,255,.12) 35%,
    transparent 70%
  );
  filter:blur(12px);
  animation:coreGlow 1.5s infinite alternate;
}

@keyframes coreGlow{
  from{transform:scale(.85);opacity:.55}
  to{transform:scale(1.15);opacity:1}
}

.ring{
  position:absolute;
  inset:8%;
  border-radius:50%;
  border:1px solid rgba(100,220,255,.22);
  box-shadow:
    0 0 30px rgba(0,190,255,.12),
    inset 0 0 30px rgba(0,190,255,.06);
}

.ring.r1{
  animation:spin 16s linear infinite;
  border-top-color:#54e7ff;
  border-bottom-color:rgba(84,231,255,.05);
}

.ring.r2{
  inset:16%;
  animation:spinReverse 11s linear infinite;
  border-left-color:#59b9ff;
  border-right-color:rgba(89,185,255,.05);
}

.ring.r3{
  inset:26%;
  animation:spin 7s linear infinite;
  border-top-color:#b3f4ff;
  border-bottom-color:#178bc0;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

@keyframes spinReverse{
  to{transform:rotate(-360deg)}
}

.core{
  position:absolute;
  inset:35%;
  border-radius:50%;
  border:2px solid rgba(130,240,255,.9);
  box-shadow:
    0 0 15px rgba(0,210,255,.9),
    0 0 45px rgba(0,150,255,.5),
    inset 0 0 25px rgba(0,220,255,.45);
  background:radial-gradient(
    circle,
    rgba(150,245,255,.85),
    rgba(0,150,255,.25) 35%,
    rgba(0,20,40,.8) 70%
  );
  animation:coreBeat 1.8s infinite;
}

@keyframes coreBeat{
  0%,100%{transform:scale(.96)}
  50%{transform:scale(1.05)}
}

.coreText{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  color:white;
  text-shadow:0 0 12px #22d8ff;
  font-size:10px;
  letter-spacing:3px;
  font-weight:700;
}

.coreText strong{
  display:block;
  font-size:18px;
  letter-spacing:4px;
}

.progress{
  position:absolute;
  left:50%;
  bottom:25%;
  transform:translateX(-50%);
  width:min(270px,70vw);
  text-align:center;
}

.progressLabel{
  display:flex;
  justify-content:space-between;
  font-size:8px;
  letter-spacing:2px;
  opacity:.7;
  margin-bottom:6px;
}

.progressBar{
  height:3px;
  background:rgba(100,220,255,.12);
  overflow:hidden;
  border-radius:5px;
}

.progressFill{
  width:0%;
  height:100%;
  background:#72eaff;
  box-shadow:0 0 12px #38dfff;
  transition:width .25s ease;
}

.tiles{
  position:absolute;
  left:12px;
  right:12px;
  bottom:115px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.tile{
  min-height:48px;
  padding:7px 5px;
  border:1px solid rgba(100,220,255,.15);
  background:rgba(0,20,35,.42);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  overflow:hidden;
  position:relative;
}

.tile::before{
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:100%;
  height:1px;
  background:#5de9ff;
  box-shadow:0 0 8px #5de9ff;
}

.tile.active{
  border-color:rgba(100,230,255,.65);
  box-shadow:
    0 0 16px rgba(0,190,255,.16),
    inset 0 0 12px rgba(0,190,255,.05);
}

.tile.active::before{
  animation:tileScan .8s linear infinite;
}

@keyframes tileScan{
  to{left:100%}
}

.tileName{
  font-size:7px;
  letter-spacing:1.5px;
  opacity:.5;
}

.tileValue{
  margin-top:4px;
  font-size:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.log{
  position:absolute;
  left:14px;
  right:14px;
  bottom:65px;
  height:40px;
  overflow:hidden;
  font-family:monospace;
  font-size:8px;
  line-height:13px;
  opacity:.55;
  text-shadow:0 0 8px rgba(80,220,255,.5);
}

.logLine{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.inputArea{
  position:absolute;
  left:10px;
  right:10px;
  bottom:max(8px,env(safe-area-inset-bottom));
  display:flex;
  gap:6px;
  pointer-events:auto;
}

.input{
  flex:1;
  min-width:0;
  height:48px;
  border:1px solid rgba(100,220,255,.3);
  border-radius:12px;
  outline:none;
  background:rgba(2,15,25,.78);
  color:#d8faff;
  padding:0 14px;
  font-size:14px;
  box-shadow:
    0 0 18px rgba(0,150,255,.08),
    inset 0 0 15px rgba(0,150,255,.04);
}

.input::placeholder{
  color:rgba(180,230,245,.35);
}

.btn{
  width:48px;
  height:48px;
  border:1px solid rgba(100,220,255,.35);
  border-radius:12px;
  background:rgba(2,20,32,.85);
  color:#bcefff;
  font-size:18px;
  box-shadow:0 0 15px rgba(0,170,255,.08);
}

.btn:active{
  transform:scale(.94);
}

.voice{
  border-color:rgba(75,240,210,.45);
}

.voice.live{
  background:rgba(0,90,80,.4);
  border-color:#4affd1;
  box-shadow:0 0 25px rgba(50,255,210,.25);
  animation:voicePulse 1s infinite;
}

@keyframes voicePulse{
  50%{box-shadow:0 0 40px rgba(50,255,210,.45)}
}

.processing{
  position:absolute;
  inset:0;
  z-index:30;
  display:none;
  place-items:center;
  pointer-events:none;
}

.processing.show{
  display:grid;
}

.processingText{
  text-align:center;
  letter-spacing:4px;
  font-size:9px;
  text-shadow:0 0 15px #38dfff;
}

.processingText strong{
  display:block;
  font-size:24px;
  margin-bottom:8px;
  letter-spacing:6px;
}

.hit{
  position:absolute;
  width:8px;
  height:8px;
  border-radius:50%;
  border:1px solid #a9f5ff;
  box-shadow:0 0 18px #28dfff;
  pointer-events:none;
  z-index:5;
}

@media(max-width:390px){
  .tiles{
    bottom:116px;
  }

  .tile{
    min-height:43px;
  }

  .tileValue{
    font-size:8px;
  }

  .title{
    font-size:17px;
  }
}
</style>
</head>

<body>

<canvas id="stars"></canvas>
<canvas id="world"></canvas>
<canvas id="fx"></canvas>

<div class="scanlines"></div>
<div class="vignette"></div>

<div class="hud">

  <div class="top">

    <div class="brand">
      <div class="logo"></div>

      <div>
        <div class="title">LUCEN</div>
        <div class="subtitle">PERSONAL INTELLIGENCE SYSTEM</div>
      </div>
    </div>

    <div class="status">
      <span class="statusDot"></span>
      ONLINE
      <br>
      <span id="clock">--:--:--</span>
    </div>

  </div>

  <div class="coreArea">

    <div class="coreGlow"></div>

    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>

    <div class="core">
      <div class="coreText">
        <strong>LUCEN</strong>
        AI CORE
      </div>
    </div>

  </div>

  <div class="progress">

    <div class="progressLabel">
      <span id="operation">SYSTEM READY</span>
      <span id="percent">0%</span>
    </div>

    <div class="progressBar">
      <div class="progressFill" id="progressFill"></div>
    </div>

  </div>

  <div class="tiles">

    <div class="tile" id="tileAnalysis">
      <div class="tileName">ANALYSIS</div>
      <div class="tileValue" id="analysisValue">STANDBY</div>
    </div>

    <div class="tile" id="tileWeb">
      <div class="tileName">WEB SEARCH</div>
      <div class="tileValue" id="webValue">READY</div>
    </div>

    <div class="tile" id="tileSources">
      <div class="tileName">SOURCES</div>
      <div class="tileValue" id="sourceValue">0</div>
    </div>

    <div class="tile" id="tileProcess">
      <div class="tileName">PROCESSING</div>
      <div class="tileValue" id="processValue">IDLE</div>
    </div>

    <div class="tile">
      <div class="tileName">NETWORK</div>
      <div class="tileValue" id="networkValue">CONNECTED</div>
    </div>

    <div class="tile">
      <div class="tileName">MEMORY</div>
      <div class="tileValue">READY</div>
    </div>

    <div class="tile">
      <div class="tileName">CORE</div>
      <div class="tileValue">GPT ACTIVE</div>
    </div>

    <div class="tile">
      <div class="tileName">SECURITY</div>
      <div class="tileValue">NOMINAL</div>
    </div>

  </div>

  <div class="log" id="log"></div>

  <div class="inputArea">

    <input
      id="input"
      class="input"
      type="text"
      autocomplete="off"
      placeholder="Mit LUCEN sprechen..."
    >

    <button
      id="send"
      class="btn"
      type="button"
    >➤</button>

    <button
      id="voice"
      class="btn voice"
      type="button"
    >🎙</button>

  </div>

</div>

<div class="processing" id="processing">

  <div class="processingText">

    <strong id="processingTitle">
      ANALYZING
    </strong>

    <span id="processingSub">
      LUCEN CORE ACTIVE
    </span>

  </div>

</div>

<script>

/* =========================================================
   LUCEN VISUAL CORE
   ========================================================= */

const stars = document.getElementById("stars");
const world = document.getElementById("world");
const fx = document.getElementById("fx");

const sc = stars.getContext("2d");
const wc = world.getContext("2d");
const fc = fx.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize(){

  W = innerWidth;
  H = innerHeight;

  for(const c of [stars,world,fx]){
    c.width = W * devicePixelRatio;
    c.height = H * devicePixelRatio;
    c.style.width = W+"px";
    c.style.height = H+"px";

    const ctx =
      c === stars ? sc :
      c === world ? wc : fc;

    ctx.setTransform(
      devicePixelRatio,
      0,
      0,
      devicePixelRatio,
      0,
      0
    );
  }
}

addEventListener("resize",resize);
resize();


/* =========================================================
   STAR FIELD
   ========================================================= */

const starList = [];

for(let i=0;i<180;i++){

  starList.push({
    x:Math.random()*W,
    y:Math.random()*H,
    r:Math.random()*1.3+.15,
    a:Math.random(),
    s:Math.random()*.01+.002
  });

}

function drawStars(){

  sc.clearRect(0,0,W,H);

  for(const s of starList){

    s.a += s.s;

    const alpha =
      .18 +
      Math.abs(Math.sin(s.a))*0.5;

    sc.globalAlpha = alpha;

    sc.beginPath();
    sc.arc(
      s.x,
      s.y,
      s.r,
      0,
      Math.PI*2
    );

    sc.fillStyle="#8ddfff";
    sc.fill();
  }

  sc.globalAlpha=1;
}


/* =========================================================
   WORLD / RADAR GRID
   ========================================================= */

let worldAngle=0;

const targets = [];

function createTarget(){

  targets.push({

    x:W*.18 + Math.random()*W*.64,
    y:H*.25 + Math.random()*H*.32,

    life:1,
    size:2+Math.random()*3,

    pulse:Math.random()*Math.PI*2

  });

  if(targets.length>14)
    targets.shift();
}

function drawWorld(){

  wc.clearRect(0,0,W,H);

  const cx=W/2;
  const cy=H*.43;

  const radius=Math.min(W*.46,H*.29);

  /* globe */

  wc.save();

  wc.translate(cx,cy);

  wc.strokeStyle="rgba(50,190,240,.13)";
  wc.lineWidth=1;

  for(let i=-4;i<=4;i++){

    const y=i*radius*.22;

    wc.beginPath();

    wc.ellipse(
      0,
      y,
      radius,
      Math.max(2,radius*.18),
      0,
      0,
      Math.PI*2
    );

    wc.stroke();
  }

  for(let i=-5;i<=5;i++){

    const x=i*radius*.18;

    wc.beginPath();

    wc.ellipse(
      x,
      0,
      Math.max(2,radius*.2),
      radius,
      0,
      0,
      Math.PI*2
    );

    wc.stroke();
  }

  wc.beginPath();

  wc.arc(
    0,
    0,
    radius,
    0,
    Math.PI*2
  );

  wc.stroke();

  /* latitude */

  wc.strokeStyle="rgba(60,210,255,.07)";

  for(let y=-radius;y<=radius;y+=18){

    wc.beginPath();
    wc.moveTo(-radius,y);
    wc.lineTo(radius,y);
    wc.stroke();

  }

  wc.restore();


  /* radar sweep */

  worldAngle += .008;

  wc.save();

  wc.translate(cx,cy);

  wc.rotate(worldAngle);

  const grad=wc.createLinearGradient(
    0,0,
    radius,0
  );

  grad.addColorStop(0,"rgba(70,230,255,0)");
  grad.addColorStop(.75,"rgba(70,230,255,.08)");
  grad.addColorStop(1,"rgba(100,240,255,.3)");

  wc.fillStyle=grad;

  wc.beginPath();
  wc.moveTo(0,0);
  wc.arc(
    0,
    0,
    radius,
    -.35,
    .35
  );

  wc.closePath();
  wc.fill();

  wc.restore();


  /* targets */

  for(const t of targets){

    t.pulse += .08;

    const p =
      1 +
      Math.sin(t.pulse)*.5;

    wc.beginPath();

    wc.arc(
      t.x,
      t.y,
      t.size*p,
      0,
      Math.PI*2
    );

    wc.fillStyle="rgba(100,235,255,.9)";
    wc.shadowBlur=15;
    wc.shadowColor="#29dfff";
    wc.fill();

    wc.shadowBlur=0;

    wc.beginPath();

    wc.arc(
      t.x,
      t.y,
      10+p*3,
      0,
      Math.PI*2
    );

    wc.strokeStyle="rgba(60,220,255,.25)";
    wc.stroke();

  }
}


/* =========================================================
   DATA PACKETS
   ========================================================= */

const packets=[];

function spawnPacket(){

  const start={
    x:W/2,
    y:H*.43
  };

  const target=
    targets[
      Math.floor(
        Math.random()*targets.length
      )
    ];

  if(!target)return;

  packets.push({

    x:start.x,
    y:start.y,

    tx:target.x,
    ty:target.y,

    p:0,

    speed:.008+Math.random()*.018

  });

}

function drawPackets(){

  for(let i=packets.length-1;i>=0;i--){

    const p=packets[i];

    p.p += p.speed;

    p.x +=
      (p.tx-p.x)*.035;

    p.y +=
      (p.ty-p.y)*.035;

    fc.beginPath();

    fc.arc(
      p.x,
      p.y,
      2,
      0,
      Math.PI*2
    );

    fc.fillStyle="#baf8ff";
    fc.shadowBlur=12;
    fc.shadowColor="#22dfff";
    fc.fill();

    fc.shadowBlur=0;

    if(p.p>=1)
      packets.splice(i,1);

  }

}


/* =========================================================
   FX LOOP
   ========================================================= */

function animationLoop(){

  drawStars();
  drawWorld();

  fc.clearRect(0,0,W,H);

  drawPackets();

  requestAnimationFrame(animationLoop);

}

animationLoop();


/* =========================================================
   HUD STATE
   ========================================================= */

const input =
  document.getElementById("input");

const send =
  document.getElementById("send");

const voice =
  document.getElementById("voice");

const log =
  document.getElementById("log");

const progressFill =
  document.getElementById("progressFill");

const percent =
  document.getElementById("percent");

const operation =
  document.getElementById("operation");

const processing =
  document.getElementById("processing");

const processingTitle =
  document.getElementById("processingTitle");

const processingSub =
  document.getElementById("processingSub");

const analysisValue =
  document.getElementById("analysisValue");

const webValue =
  document.getElementById("webValue");

const sourceValue =
  document.getElementById("sourceValue");

const processValue =
  document.getElementById("processValue");

const tileAnalysis =
  document.getElementById("tileAnalysis");

const tileWeb =
  document.getElementById("tileWeb");

const tileSources =
  document.getElementById("tileSources");

const tileProcess =
  document.getElementById("tileProcess");


function addLog(text){

  const line=
    document.createElement("div");

  line.className="logLine";

  line.textContent=
    "› "+text;

  log.prepend(line);

  while(log.children.length>5)
    log.lastChild.remove();

}


function setProgress(value,text){

  const v=
    Math.max(
      0,
      Math.min(100,value)
    );

  progressFill.style.width=v+"%";
  percent.textContent=
    Math.round(v)+"%";

  if(text)
    operation.textContent=text;

}


function activate(tile,value){

  tile.classList.add("active");

  if(value!==undefined){

    const el=
      tile.querySelector(".tileValue");

    if(el)
      el.textContent=value;

  }

}


function deactivate(tile){

  tile.classList.remove("active");

}


function createHits(count=3){

  for(let i=0;i<count;i++){

    setTimeout(()=>{

      const hit=
        document.createElement("div");

      hit.className="hit";

      hit.style.left=
        (15+Math.random()*70)+"%";

      hit.style.top=
        (25+Math.random()*38)+"%";

      document.body.appendChild(hit);

      hit.animate(
        [
          {
            transform:"scale(.2)",
            opacity:0
          },
          {
            transform:"scale(1)",
            opacity:1
          },
          {
            transform:"scale(3)",
            opacity:0
          }
        ],
        {
          duration:900,
          easing:"ease-out"
        }
      );

      setTimeout(
        ()=>hit.remove(),
        950
      );

    },i*220);

  }

}


/* =========================================================
   CLOCK
   ========================================================= */

function updateClock(){

  const now=new Date();

  document.getElementById("clock")
    .textContent=
      now.toLocaleTimeString(
        "de-DE",
        {
          hour12:false
        }
      );

}

setInterval(updateClock,1000);
updateClock();


/* =========================================================
   PREPARE SEARCH VISUAL
   ========================================================= */

function startSearchVisual(){

  processing.classList.add("show");

  processingTitle.textContent=
    "ANALYZING";

  processingSub.textContent=
    "INITIALIZING LUCEN CORE";

  setProgress(
    8,
    "INITIALIZING"
  );

  activate(
    tileAnalysis,
    "SCANNING"
  );

  activate(
    tileProcess,
    "ACTIVE"
  );

  addLog(
    "Neural core initialized"
  );

  setTimeout(()=>{

    processingTitle.textContent=
      "SEARCHING";

    processingSub.textContent=
      "GLOBAL WEB INTELLIGENCE";

    setProgress(
      32,
      "GLOBAL SEARCH"
    );

    activate(
      tileWeb,
      "SEARCHING"
    );

    webValue.textContent=
      "ACTIVE";

    addLog(
      "Global web search started"
    );

    for(let i=0;i<5;i++)
      setTimeout(createTarget,i*180);

    for(let i=0;i<15;i++)
      setTimeout(spawnPacket,i*120);

  },450);


  setTimeout(()=>{

    processingTitle.textContent=
      "PROCESSING";

    processingSub.textContent=
      "SOURCE ANALYSIS";

    setProgress(
      58,
      "PROCESSING SOURCES"
    );

    activate(
      tileSources,
      "SCANNING"
    );

    sourceValue.textContent=
      Math.floor(
        3+Math.random()*12
      );

    addLog(
      "Sources being analyzed"
    );

    createHits(5);

  },1050);


  setTimeout(()=>{

    setProgress(
      78,
      "CROSS CHECKING"
    );

    addLog(
      "Cross-source verification active"
    );

  },1600);

}


function finishSearchVisual(){

  processingTitle.textContent=
    "COMPLETE";

  processingSub.textContent=
    "LUCEN RESPONSE READY";

  setProgress(
    100,
    "COMPLETE"
  );

  analysisValue.textContent=
    "COMPLETE";

  webValue.textContent=
    "ONLINE";

  processValue.textContent=
    "COMPLETE";

  addLog(
    "Analysis completed successfully"
  );

  createHits(3);

  setTimeout(()=>{

    processing.classList.remove("show");

    deactivate(tileAnalysis);
    deactivate(tileWeb);
    deactivate(tileSources);
    deactivate(tileProcess);

  },900);

}


/* =========================================================
   LUCEN BACKEND
   ========================================================= */

async function askLucen(message){

  if(!message.trim())
    return;

  startSearchVisual();

  const lower=
    message.toLowerCase();

  const looksLikeSearch=[
    "suche",
    "such",
    "internet",
    "web",
    "recherche",
    "aktuell",
    "heute",
    "jetzt",
    "news",
    "nachrichten",
    "preis",
    "wetter",
    "öffnungszeiten",
    "quelle"
  ].some(
    x=>lower.includes(x)
  );

  try{

    const response=
      await fetch(
        "/.netlify/functions/lucen-v2",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            message
          })
        }
      );

    const data=
      await response.json();

    if(!response.ok)
      throw new Error(
        data?.error ||
        "LUCEN Backend Fehler"
      );

    setProgress(
      92,
      "GENERATING RESPONSE"
    );

    addLog(
      "Response synthesis active"
    );

    if(data?.analysis){

      const modules=
        data.analysis.modules ||
        [];

      for(
        const module of modules
      ){

        addLog(
          module
        );

      }

    }

    finishSearchVisual();

    return data?.reply ||
      "Keine Antwort erhalten.";

  }catch(error){

    processingTitle.textContent=
      "ERROR";

    processingSub.textContent=
      error.message ||
      "Connection failure";

    operation.textContent=
      "SYSTEM ERROR";

    addLog(
      "ERROR: "+
      (error.message || "Unknown")
    );

    progressFill.style.width="0%";
    percent.textContent="ERR";

    return(
      "Ich konnte LUCEN gerade nicht erreichen. "+
      (error.message || "")
    );

  }

}


/* =========================================================
   SEND
   ========================================================= */

async function sendMessage(){

  const message=
    input.value.trim();

  if(!message)
    return;

  input.value="";

  addLog(
    "USER INPUT RECEIVED"
  );

  const answer=
    await askLucen(message);

  /*
   * Antwort anzeigen
   * Die vorhandene Oberfläche kann später
   * noch um eine echte Chat-Historie erweitert werden.
   */

  addLog(
    "LUCEN: "+
    String(answer).slice(0,100)
  );

}

send.addEventListener(
  "click",
  sendMessage
);

input.addEventListener(
  "keydown",
  e=>{

    if(e.key==="Enter")
      sendMessage();

  }
);

   INIT
   ========================================================= */

addLog(
  "LUCEN SYSTEM ONLINE"
);

addLog(
  "Awaiting command..."
);

</script>
