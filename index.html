<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUCEN</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at center, #10233b 0%, #050912 45%, #02040a 100%);
  color: #eaf6ff;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.app {
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

header {
  width: 100%;
  padding: 25px 20px 10px;
  text-align: center;
}

.logo {
  font-size: 34px;
  font-weight: bold;
  letter-spacing: 8px;
  text-shadow: 0 0 20px #36bfff;
}

.status {
  margin-top: 8px;
  font-size: 11px;
  letter-spacing: 3px;
  opacity: .7;
}

.core {
  width: 190px;
  height: 190px;
  margin-top: 45px;
  border-radius: 50%;
  border: 3px solid #38bfff;
  box-shadow:
    0 0 20px #38bfff,
    0 0 60px rgba(56,191,255,.5),
    inset 0 0 35px rgba(56,191,255,.35);
  display: flex;
  align-items: center;
  justify-content: center;
  animation: pulse 2s infinite;
}

.core-inner {
  width: 105px;
  height: 105px;
  border-radius: 50%;
  background: radial-gradient(circle, #fff 0%, #55d5ff 20%, #087aa8 55%, #03101c 75%);
  box-shadow: 0 0 35px #45d7ff;
}

@keyframes pulse {
  50% {
    transform: scale(1.05);
  }
}

.chat {
  width: calc(100% - 30px);
  max-width: 650px;
  flex: 1;
  margin-top: 30px;
  overflow-y: auto;
  padding: 10px;
}

.message {
  padding: 12px 15px;
  margin: 8px 0;
  border-radius: 14px;
  background: rgba(20,35,55,.75);
  border: 1px solid rgba(80,190,255,.2);
  white-space: pre-wrap;
}

.user {
  text-align: right;
  background: rgba(8,125,169,.25);
}

.input-area {
  width: calc(100% - 20px);
  max-width: 650px;
  display: flex;
  gap: 8px;
  padding: 10px;
  padding-bottom: 18px;
}

input {
  flex: 1;
  padding: 15px;
  border-radius: 14px;
  border: 1px solid #247da5;
  background: #07111d;
  color: white;
  outline: none;
}

button {
  border: none;
  border-radius: 14px;
  padding: 0 17px;
  background: #087da9;
  color: white;
  font-weight: bold;
}

button:active {
  transform: scale(.96);
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">LUCEN</div>
  <div class="status" id="status">SYSTEM ONLINE</div>
</header>

<div class="core">
  <div class="core-inner"></div>
</div>

<div class="chat" id="chat">
  <div class="message">
    LUCEN online. Ich bin bereit.
  </div>
</div>

<div class="input-area">
  <input id="input" placeholder="Sprich mit LUCEN..." autocomplete="off">
  <button onclick="sendMessage()">➤</button>
  <button onclick="voice()">🎙️</button>
</div>

</div>

<script>
const input = document.getElementById("input");
const chat = document.getElementById("chat");
const statusText = document.getElementById("status");

function addMessage(text, type = "") {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {
  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  statusText.textContent = "LUCEN DENKT...";

  try {
    const response = await fetch("/.netlify/functions/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Fehler");
    }

    addMessage(data.reply);

  } catch (error) {
    addMessage("Verbindung zu meinem KI-System fehlgeschlagen.");
    console.error(error);
  }

  statusText.textContent = "SYSTEM ONLINE";
}

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    sendMessage();
  }
});

function voice() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    addMessage("Spracherkennung wird auf diesem Gerät nicht unterstützt.");
    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "de-DE";
  recognition.interimResults = false;
  recognition.continuous = false;

  statusText.textContent = "ICH HÖRE...";

  recognition.start();

  recognition.onresult = function(event) {
    input.value = event.results[0][0].transcript;
    sendMessage();
  };

  recognition.onerror = function() {
    statusText.textContent = "SYSTEM ONLINE";
    addMessage("Ich konnte dich leider nicht verstehen.");
  };

  recognition.onend = function() {
    if (statusText.textContent === "ICH HÖRE...") {
      statusText.textContent = "SYSTEM ONLINE";
    }
  };
}
</script>

</body>
</html>
