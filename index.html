<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#02070c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>LUCEN</title>

  <style>
    :root {
      --bg: #02070c;
      --panel: rgba(5, 17, 27, .72);
      --line: rgba(63, 208, 255, .25);
      --cyan: #47ddff;
      --cyan2: #008cff;
      --white: #eaffff;
      --muted: #7195a5;
      --danger: #ff536b;
      --green: #49f2b5;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--white);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;
    }

    body {
      position: relative;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 50% 34%, rgba(0, 159, 255, .13), transparent 32%),
        radial-gradient(circle at 50% 100%, rgba(0, 93, 160, .09), transparent 40%),
        #02070c;
    }

    /* ─────────────────────────────
       BACKGROUND HUD
    ───────────────────────────── */

    .grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .17;
      background-image:
        linear-gradient(rgba(71,221,255,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(71,221,255,.08) 1px, transparent 1px);
      background-size: 38px 38px;
      mask-image: linear-gradient(to bottom, transparent, black 18%, black 82%, transparent);
    }

    .scanline {
      position: fixed;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(71,221,255,.18);
      box-shadow: 0 0 15px rgba(71,221,255,.25);
      animation: scan 6s linear infinite;
      pointer-events: none;
      z-index: 2;
    }

    @keyframes scan {
      from { top: -2px; }
      to { top: 100%; }
    }

    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .corner {
      position: absolute;
      width: 42px;
      height: 42px;
      border-color: rgba(71,221,255,.45);
    }

    .corner.tl {
      top: 18px;
      left: 18px;
      border-top: 1px solid;
      border-left: 1px solid;
    }

    .corner.tr {
      top: 18px;
      right: 18px;
      border-top: 1px solid;
      border-right: 1px solid;
    }

    .corner.bl {
      bottom: 18px;
      left: 18px;
      border-bottom: 1px solid;
      border-left: 1px solid;
    }

    .corner.br {
      bottom: 18px;
      right: 18px;
      border-bottom: 1px solid;
      border-right: 1px solid;
    }

    /* ─────────────────────────────
       APP
    ───────────────────────────── */

    .app {
      position: relative;
      width: 100%;
      height: 100dvh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding:
        calc(env(safe-area-inset-top) + 16px)
        18px
        calc(env(safe-area-inset-bottom) + 14px);
      z-index: 3;
    }

    /* ─────────────────────────────
       TOP
    ───────────────────────────── */

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 48px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow:
        0 0 8px var(--cyan),
        0 0 24px rgba(71,221,255,.7);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,100% { opacity: .55; transform: scale(.8); }
      50% { opacity: 1; transform: scale(1); }
    }

    .brand-name {
      font-size: 17px;
      letter-spacing: 5px;
      font-weight: 700;
    }

    .brand-sub {
      color: var(--muted);
      font-size: 8px;
      letter-spacing: 2px;
      margin-top: 3px;
    }

    .top-right {
      text-align: right;
    }

    #clock {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--cyan);
    }

    #connection {
      margin-top: 4px;
      color: var(--green);
      font-size: 8px;
      letter-spacing: 1.7px;
    }

    /* ─────────────────────────────
       MAIN REACTOR
    ───────────────────────────── */

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }

    .reactor-wrap {
      position: relative;
      width: min(72vw, 300px);
      height: min(72vw, 300px);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: -5vh;
    }

    .orbit {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(71,221,255,.18);
    }

    .orbit.one {
      inset: 4%;
      border-right-color: rgba(71,221,255,.7);
      border-bottom-color: transparent;
      animation: spin 12s linear infinite;
    }

    .orbit.two {
      inset: 13%;
      border-left-color: rgba(0,140,255,.75);
      border-top-color: transparent;
      animation: spinReverse 8s linear infinite;
    }

    .orbit.three {
      inset: 22%;
      border-top-color: rgba(71,221,255,.65);
      border-bottom-color: transparent;
      animation: spin 5s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes spinReverse {
      to { transform: rotate(-360deg); }
    }

    .reactor {
      position: relative;
      width: 37%;
      height: 37%;
      border-radius: 50%;
      background:
        radial-gradient(circle,
          #efffff 0%,
          #7feeff 13%,
          #19b9ff 28%,
          rgba(0,113,202,.55) 48%,
          rgba(0,44,82,.2) 66%,
          transparent 72%);
      box-shadow:
        0 0 12px #48ddff,
        0 0 35px rgba(0,170,255,.9),
        0 0 80px rgba(0,120,255,.45);
      animation: reactorIdle 2.4s ease-in-out infinite;
    }

    .reactor::before {
      content: "";
      position: absolute;
      inset: 17%;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.9);
      box-shadow: inset 0 0 14px rgba(255,255,255,.6);
    }

    .reactor::after {
      content: "";
      position: absolute;
      inset: -18%;
      border-radius: 50%;
      border: 1px solid rgba(71,221,255,.08);
    }

    @keyframes reactorIdle {
      0%,100% {
        transform: scale(.94);
        filter: brightness(.9);
      }
      50% {
        transform: scale(1.04);
        filter: brightness(1.25);
      }
    }

    .active .reactor {
      animation:
        reactorActive .65s ease-in-out infinite alternate;
    }

    @keyframes reactorActive {
      from {
        transform: scale(.95);
        filter: brightness(1);
      }
      to {
        transform: scale(1.09);
        filter: brightness(1.55);
      }
    }

    /* ─────────────────────────────
       STATUS
    ───────────────────────────── */

    .status {
      margin-top: 14px;
      text-align: center;
    }

    .status-main {
      font-size: 11px;
      letter-spacing: 4px;
      font-weight: 700;
      color: var(--cyan);
    }

    .status-sub {
      margin-top: 8px;
      font-size: 8px;
      letter-spacing: 2px;
      color: var(--muted);
    }

    /* ─────────────────────────────
       VISUALIZER
    ───────────────────────────── */

    .visualizer {
      height: 30px;
      width: min(75vw, 280px);
      margin-top: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      opacity: .45;
    }

    .bar {
      width: 2px;
      height: 5px;
      background: var(--cyan);
      box-shadow: 0 0 7px rgba(71,221,255,.6);
      border-radius: 2px;
      transition: height .1s ease;
    }

    .active .bar {
      animation: bars .7s ease-in-out infinite alternate;
    }

    .bar:nth-child(2) { animation-delay: -.1s; }
    .bar:nth-child(3) { animation-delay: -.2s; }
    .bar:nth-child(4) { animation-delay: -.3s; }
    .bar:nth-child(5) { animation-delay: -.4s; }
    .bar:nth-child(6) { animation-delay: -.5s; }
    .bar:nth-child(7) { animation-delay: -.2s; }
    .bar:nth-child(8) { animation-delay: -.4s; }

    @keyframes bars {
      from { height: 4px; }
      to { height: 24px; }
    }

    /* ─────────────────────────────
       CHAT
    ───────────────────────────── */

    .chat {
      width: 100%;
      max-width: 650px;
      height: 0;
      overflow: hidden;
      opacity: 0;
      transition: .35s ease;
      border: 1px solid transparent;
      border-radius: 18px;
      background: rgba(2,9,15,.82);
    }

    .chat.open {
      height: 24vh;
      min-height: 130px;
      opacity: 1;
      border-color: var(--line);
      margin-bottom: 10px;
      overflow-y: auto;
      padding: 12px;
    }

    .message {
      margin-bottom: 10px;
      font-size: 12px;
      line-height: 1.45;
    }

    .message .label {
      display: block;
      font-size: 7px;
      letter-spacing: 2px;
      margin-bottom: 3px;
      color: var(--muted);
    }

    .message.user .label {
      color: var(--cyan);
    }

    .message.lucen .label {
      color: var(--green);
    }

    /* ─────────────────────────────
       CONTROLS
    ───────────────────────────── */

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 13px;
      margin-bottom: 10px;
    }

    button {
      font: inherit;
      color: var(--white);
      border: 0;
      outline: none;
      cursor: pointer;
    }

    .control {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(9,28,41,.78);
      border: 1px solid rgba(71,221,255,.22);
      box-shadow: inset 0 0 18px rgba(0,140,255,.05);
      color: var(--cyan);
      font-size: 17px;
    }

    .control:active {
      transform: scale(.94);
    }

    .voice {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 45%,
          rgba(71,221,255,.35),
          rgba(0,88,150,.2) 45%,
          rgba(2,12,20,.9) 70%);
      border: 1px solid rgba(71,221,255,.65);
      box-shadow:
        0 0 16px rgba(71,221,255,.35),
        inset 0 0 24px rgba(0,142,255,.15);
      font-size: 25px;
      color: var(--cyan);
      transition: .25s ease;
    }

    .voice.active {
      border-color: var(--cyan);
      box-shadow:
        0 0 25px rgba(71,221,255,.65),
        0 0 70px rgba(0,119,255,.3),
        inset 0 0 35px rgba(0,180,255,.25);
      transform: scale(1.04);
    }

    .voice:active {
      transform: scale(.96);
    }

    .hint {
      text-align: center;
      font-size: 7px;
      color: #547382;
      letter-spacing: 2px;
      margin-bottom: 2px;
    }

    /* ─────────────────────────────
       TEXT INPUT
    ───────────────────────────── */

    .input-row {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 650px;
    }

    .input {
      flex: 1;
      min-width: 0;
      height: 44px;
      border-radius: 14px;
      border: 1px solid rgba(71,221,255,.18);
      background: rgba(5,18,27,.8);
      color: white;
      padding: 0 14px;
      font-size: 13px;
      outline: none;
    }

    .input:focus {
      border-color: rgba(71,221,255,.55);
      box-shadow: 0 0 18px rgba(0,140,255,.08);
    }

    .send {
      width: 48px;
      height: 44px;
      border-radius: 14px;
      background: rgba(10,38,55,.9);
      border: 1px solid rgba(71,221,255,.3);
      color: var(--cyan);
      font-size: 17px;
    }

    /* ─────────────────────────────
       SMALL TELEMETRY
    ───────────────────────────── */

    .telemetry {
      position: absolute;
      left: 20px;
      bottom: calc(env(safe-area-inset-bottom) + 76px);
      font-size: 7px;
      line-height: 1.8;
      letter-spacing: 1px;
      color: #426270;
      pointer-events: none;
    }

    .telemetry strong {
      color: rgba(71,221,255,.65);
      font-weight: 500;
    }

    /* ─────────────────────────────
       DESKTOP
    ───────────────────────────── */

    @media (min-width: 700px) {
      .app {
        padding-left: 42px;
        padding-right: 42px;
      }

      .reactor-wrap {
        width: 330px;
        height: 330px;
      }

      .chat.open {
        height: 220px;
      }
    }

    /* ─────────────────────────────
       RED ERROR STATE
    ───────────────────────────── */

    .error .brand-dot {
      background: var(--danger);
      box-shadow: 0 0 15px var(--danger);
    }

    .error .status-main {
      color: var(--danger);
    }
  </style>
</head>

<body>

  <div class="grid"></div>
  <div class="scanline"></div>

  <div class="hud">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
  </div>

  <main class="app" id="app">

    <!-- TOP -->
    <header class="top">

      <div class="brand">
        <div class="brand-dot"></div>

        <div>
          <div class="brand-name">LUCEN</div>
          <div class="brand-sub">PERSONAL INTELLIGENCE SYSTEM</div>
        </div>
      </div>

      <div class="top-right">
        <div id="clock">--:--:--</div>
        <div id="connection">SYSTEM READY</div>
      </div>

    </header>

    <!-- MAIN -->
    <section class="main">

      <div class="reactor-wrap" id="reactorWrap">

        <div class="orbit one"></div>
        <div class="orbit two"></div>
        <div class="orbit three"></div>

        <div class="reactor"></div>

      </div>

      <div class="status">

        <div class="status-main" id="status">
          LUCEN ONLINE
        </div>

        <div class="status-sub" id="statusSub">
          READY FOR ACTIVATION
        </div>

      </div>

      <div class="visualizer" id="visualizer"></div>

    </section>

    <!-- CHAT -->
    <section class="chat" id="chat"></section>

    <!-- CONTROLS -->
    <div class="controls">

      <button
        class="control"
        id="chatButton"
        aria-label="Chat öffnen"
      >
        ◇
      </button>

      <button
        class="voice"
        id="voiceButton"
        aria-label="LUCEN aktivieren"
      >
        ◉
      </button>

      <button
        class="control"
        id="clearButton"
        aria-label="Chat löschen"
      >
        ×
      </button>

    </div>

    <div class="hint">
      EINMAL AKTIVIEREN · DANACH FREISPRECHEN
    </div>

    <!-- TEXT CHAT -->
    <form class="input-row" id="textForm">

      <input
        id="textInput"
        class="input"
        autocomplete="off"
        placeholder="Mit LUCEN schreiben..."
      >

      <button
        class="send"
        type="submit"
        aria-label="Senden"
      >
        ↑
      </button>

    </form>

    <div class="telemetry">
      <div><strong>CORE</strong> ONLINE</div>
      <div><strong>VOICE</strong> REALTIME</div>
      <div><strong>LINK</strong> SECURE</div>
    </div>

  </main>

  <audio
    id="remoteAudio"
    autoplay
    playsinline
  ></audio>


  <script>
    /* ═══════════════════════════════════════════════
       LUCEN — FINAL FRONTEND
       ═══════════════════════════════════════════════ */

    const app = document.getElementById("app");
    const voiceButton = document.getElementById("voiceButton");
    const status = document.getElementById("status");
    const statusSub = document.getElementById("statusSub");
    const connection = document.getElementById("connection");
    const remoteAudio = document.getElementById("remoteAudio");
    const chat = document.getElementById("chat");
    const chatButton = document.getElementById("chatButton");
    const clearButton = document.getElementById("clearButton");
    const textForm = document.getElementById("textForm");
    const textInput = document.getElementById("textInput");

    let peer = null;
    let dataChannel = null;
    let localStream = null;
    let voiceActive = false;
    let conversationStarted = false;

    /* ─────────────────────────────
       VISUALIZER
    ───────────────────────────── */

    for (let i = 0; i < 35; i++) {
      const bar = document.createElement("div");
      bar.className = "bar";
      document.getElementById("visualizer").appendChild(bar);
    }

    /* ─────────────────────────────
       CLOCK
    ───────────────────────────── */

    function updateClock() {
      const now = new Date();

      document.getElementById("clock").textContent =
        now.toLocaleTimeString("de-DE", {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        });
    }

    updateClock();
    setInterval(updateClock, 1000);

    /* ─────────────────────────────
       STATUS
    ───────────────────────────── */

    function setStatus(main, sub) {
      status.textContent = main;
      statusSub.textContent = sub;
    }

    /* ─────────────────────────────
       CHAT UI
    ───────────────────────────── */

    function addMessage(type, text) {
      if (!text) return;

      const message = document.createElement("div");
      message.className = "message " + type;

      const label = document.createElement("span");
      label.className = "label";
      label.textContent =
        type === "user" ? "YOU" : "LUCEN";

      const body = document.createElement("div");
      body.textContent = text;

      message.appendChild(label);
      message.appendChild(body);

      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;

      chat.classList.add("open");
    }

    chatButton.addEventListener("click", () => {
      chat.classList.toggle("open");
    });

    clearButton.addEventListener("click", () => {
      chat.innerHTML = "";
      chat.classList.remove("open");
    });

    /* ─────────────────────────────
       REALTIME EVENTS
       ───────────────────────────── */

    function handleRealtimeEvent(event) {
      if (!event || !event.type) return;

      console.log("LUCEN EVENT:", event);

      switch (event.type) {

        case "session.created":
          connection.textContent = "REALTIME LINK ACTIVE";
          connection.style.color = "var(--green)";
          break;

        case "session.updated":
          connection.textContent = "LUCEN CONNECTED";
          break;

        case "input_audio_buffer.speech_started":
          app.classList.add("active");
          setStatus(
            "LISTENING",
            "ICH HÖRE ZU"
          );
          break;

        case "input_audio_buffer.speech_stopped":
          setStatus(
            "THINKING",
            "VERARBEITE"
          );
          break;

        case "response.created":
          app.classList.add("active");
          setStatus(
            "THINKING",
            "LUCEN DENKT"
          );
          break;

        case "response.output_audio_transcript.delta":
          setStatus(
            "SPEAKING",
            "LUCEN SPRICHT"
          );
          break;

        case "response.output_audio_transcript.done":
          if (event.transcript) {
            addMessage("lucen", event.transcript);
          }
          break;

        case "response.output_text.delta":
          setStatus(
            "SPEAKING",
            "LUCEN ANTWORTET"
          );
          break;

        case "response.done":
          app.classList.remove("active");

          if (voiceActive) {
            setStatus(
              "LISTENING",
              "ICH HÖRE ZU"
            );
          } else {
            setStatus(
              "LUCEN ONLINE",
              "READY FOR ACTIVATION"
            );
          }
          break;

        case "input_audio_transcription.completed":
          if (event.transcript) {
            addMessage("user", event.transcript);
          }
          break;

        case "error":
          console.error("REALTIME ERROR:", event);

          app.classList.remove("active");

          setStatus(
            "SYSTEM ERROR",
            event.error?.message || "Verbindung prüfen"
          );

          app.classList.add("error");
          break;
      }
    }

    /* ─────────────────────────────
       START REALTIME VOICE
       ───────────────────────────── */

    async function startVoice() {

      if (voiceActive) {
        stopVoice();
        return;
      }

      try {

        app.classList.remove("error");

        setStatus(
          "INITIALIZING",
          "VOICE LINK WIRD AUFGEBAUT"
        );

        connection.textContent = "CONNECTING...";
        connection.style.color = "var(--cyan)";

        /*
          iOS requires microphone permission to be
          requested from a user interaction.
        */

        localStream =
          await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            }
          });

        peer = new RTCPeerConnection();

        /*
          Receive LUCEN's generated voice.
        */

        peer.ontrack = (event) => {

          if (
            event.streams &&
            event.streams[0]
          ) {
            remoteAudio.srcObject =
              event.streams[0];

            remoteAudio.play().catch(() => {});
          }
        };

        /*
          Send microphone audio.
        */

        localStream
          .getTracks()
          .forEach((track) => {
            peer.addTrack(track, localStream);
          });

        /*
          Realtime event channel.
        */

        dataChannel =
          peer.createDataChannel("oai-events");

        dataChannel.addEventListener(
          "open",
          () => {

            console.log(
              "LUCEN DATA CHANNEL READY"
            );

            connection.textContent =
              "LUCEN ONLINE";

            connection.style.color =
              "var(--green)";

            setStatus(
              "LISTENING",
              "ICH HÖRE ZU"
            );

            /*
              The server already has the main
              session configuration.
              This update only makes the client
              behavior explicit.
            */

            const update = {
              type: "session.update",
              session: {
                type: "realtime",
                audio: {
                  input: {
                    turn_detection: {
                      type: "semantic_vad",
                      eagerness: "auto",
                      create_response: true,
                      interrupt_response: true
                    }
                  }
                }
              }
            };

            dataChannel.send(
              JSON.stringify(update)
            );

            conversationStarted = true;
          }
        );

        dataChannel.addEventListener(
          "message",
          (event) => {

            try {
              const data =
                JSON.parse(event.data);

              handleRealtimeEvent(data);

            } catch (error) {
              console.warn(
                "Invalid realtime event",
                error
              );
            }
          }
        );

        dataChannel.addEventListener(
          "close",
          () => {
            if (voiceActive) {
              connection.textContent =
                "VOICE LINK CLOSED";
            }
          }
        );

        peer.onconnectionstatechange = () => {

          console.log(
            "WebRTC:",
            peer.connectionState
          );

          if (
            peer.connectionState ===
              "connected"
          ) {
            connection.textContent =
              "REALTIME LINK ACTIVE";
          }

          if (
            peer.connectionState ===
              "failed"
          ) {
            setStatus(
              "CONNECTION LOST",
              "BITTE ERNEUT AKTIVIEREN"
            );

            stopVoice(false);
          }
        };

        /*
          Create WebRTC offer.
        */

        const offer =
          await peer.createOffer();

        await peer.setLocalDescription(
          offer
        );

        /*
          Wait for ICE gathering.
        */

        await waitForIceGathering(peer);

        /*
          Send SDP to our secure Netlify
          realtime function.
        */

        const response =
          await fetch(
            "/.netlify/functions/realtime",
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/sdp"
              },
              body:
                peer.localDescription.sdp
            }
          );

        const answer =
          await response.text();

        if (!response.ok) {
          throw new Error(
            answer ||
            "Realtime-Verbindung fehlgeschlagen."
          );
        }

        await peer.setRemoteDescription({
          type: "answer",
          sdp: answer
        });

        voiceActive = true;

        voiceButton.classList.add(
          "active"
        );

        voiceButton.textContent = "◉";

        setStatus(
          "LISTENING",
          "ICH HÖRE ZU"
        );

      } catch (error) {

        console.error(
          "LUCEN VOICE ERROR:",
          error
        );

        setStatus(
          "VOICE ERROR",
          error.message ||
            "Mikrofon oder Verbindung prüfen"
        );

        connection.textContent =
          "VOICE OFFLINE";

        connection.style.color =
          "var(--danger)";

        app.classList.add("error");

        stopVoice(false);
      }
    }

    /* ─────────────────────────────
       ICE GATHERING
       ───────────────────────────── */

    function waitForIceGathering(pc) {

      return new Promise((resolve) => {

        if (
          pc.iceGatheringState ===
          "complete"
        ) {
          resolve();
          return;
        }

        const timeout =
          setTimeout(() => {
            resolve();
          }, 4000);

        pc.addEventListener(
          "icegatheringstatechange",
          () => {

            if (
              pc.iceGatheringState ===
              "complete"
            ) {
              clearTimeout(timeout);
              resolve();
            }

          }
        );
      });
    }

    /* ─────────────────────────────
       STOP VOICE
       ───────────────────────────── */

    function stopVoice(updateUI = true) {

      voiceActive = false;

      if (dataChannel) {
        try {
          dataChannel.close();
        } catch {}
      }

      if (peer) {
        try {
          peer.close();
        } catch {}
      }

      if (localStream) {
        localStream
          .getTracks()
          .forEach(track => {
            track.stop();
          });
      }

      peer = null;
      dataChannel = null;
      localStream = null;

      remoteAudio.srcObject = null;

      app.classList.remove("active");

      voiceButton.classList.remove(
        "active"
      );

      voiceButton.textContent = "◉";

      if (updateUI) {

        connection.textContent =
          "SYSTEM READY";

        connection.style.color =
          "var(--green)";

        setStatus(
          "LUCEN ONLINE",
          "READY FOR ACTIVATION"
        );
      }
    }

    voiceButton.addEventListener(
      "click",
      startVoice
    );

    /* ─────────────────────────────
       TEXT CHAT
       ───────────────────────────── */

    textForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        const message =
          textInput.value.trim();

        if (!message) return;

        textInput.value = "";

        addMessage(
          "user",
          message
        );

        setStatus(
          "THINKING",
          "LUCEN VERARBEITET"
        );

        try {

          const response =
            await fetch(
              "/.netlify/functions/chat",
              {
                method: "POST",
                headers: {
                  "Content-Type":
                    "application/json"
                },
                body: JSON.stringify({
                  message
                })
              }
            );

          const data =
            await response.json();

          if (!response.ok || !data.ok) {
            throw new Error(
              data.error ||
              "Keine Antwort erhalten."
            );
          }

          if (data.reply) {
            addMessage(
              "lucen",
              data.reply
            );
          }

          setStatus(
            "LUCEN ONLINE",
            "READY"
          );

        } catch (error) {

          console.error(
            "CHAT ERROR:",
            error
          );

          addMessage(
            "lucen",
            "Die Verbindung zum LUCEN-Core ist momentan nicht verfügbar."
          );

          setStatus(
            "CONNECTION ERROR",
            "CHAT NICHT VERFÜGBAR"
          );
        }
      }
    );

    /* ─────────────────────────────
       ENTER KEY
       ───────────────────────────── */

    textInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {
          event.preventDefault();

          textForm.requestSubmit();
        }
      }
    );

    /* ─────────────────────────────
       INITIAL STATE
       ───────────────────────────── */

    window.addEventListener(
      "load",
      () => {

        setStatus(
          "LUCEN ONLINE",
          "READY FOR ACTIVATION"
        );

        connection.textContent =
          "SYSTEM READY";
      }
    );

    /* ─────────────────────────────
       SAFETY CLEANUP
       ───────────────────────────── */

    window.addEventListener(
      "pagehide",
      () => {
        stopVoice(false);
      }
    );

  </script>

</body>
</html>
