<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#02070c"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="LUCEN"
  >

  <title>LUCEN</title>

  <style>
    :root {
      --bg: #02070c;
      --panel: rgba(4, 16, 24, 0.78);
      --panel-strong: rgba(3, 12, 19, 0.94);

      --cyan: #00eaff;
      --cyan-soft: rgba(0, 234, 255, 0.18);
      --cyan-dim: rgba(0, 234, 255, 0.08);

      --green: #42ff9a;
      --danger: #ff496b;
      --white: #eafcff;
      --muted: #79a9b7;

      --line: rgba(0, 234, 255, 0.28);

      --shadow:
        0 0 30px rgba(0, 234, 255, 0.10),
        inset 0 0 30px rgba(0, 234, 255, 0.025);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--white);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;
      overflow-x: hidden;
    }

    body {
      min-height: 100svh;
      position: relative;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      outline: none;
    }

    /* =========================
       BACKGROUND
    ========================== */

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(
          circle at 50% 25%,
          rgba(0, 234, 255, 0.075),
          transparent 35%
        ),
        radial-gradient(
          circle at 50% 80%,
          rgba(0, 120, 255, 0.035),
          transparent 45%
        ),
        #02070c;
    }

    .grid {
      position: absolute;
      inset: -20%;
      opacity: 0.16;
      background-image:
        linear-gradient(
          rgba(0, 234, 255, 0.08) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(0, 234, 255, 0.08) 1px,
          transparent 1px
        );
      background-size: 42px 42px;
      transform: perspective(600px) rotateX(60deg) translateY(18%);
      transform-origin: center bottom;
    }

    .scanline {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(0, 234, 255, 0.20),
        transparent
      );
      animation: scan 7s linear infinite;
      opacity: 0.7;
    }

    @keyframes scan {
      0% {
        top: -5%;
      }

      100% {
        top: 105%;
      }
    }

    .glow {
      position: absolute;
      width: 360px;
      height: 360px;
      left: 50%;
      top: 13%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(0, 234, 255, 0.035);
      filter: blur(50px);
      animation: pulseGlow 4s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%,
      100% {
        opacity: 0.45;
        transform: translate(-50%, -50%) scale(0.95);
      }

      50% {
        opacity: 0.85;
        transform: translate(-50%, -50%) scale(1.08);
      }
    }

    /* =========================
       APP
    ========================== */

    .app {
      position: relative;
      z-index: 1;

      width: 100%;
      min-height: 100svh;

      padding:
        max(14px, env(safe-area-inset-top))
        14px
        max(18px, env(safe-area-inset-bottom))
        14px;

      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* =========================
       TOP BAR
    ========================== */

    .topbar {
      min-height: 64px;

      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;

      padding: 10px 12px;

      border: 1px solid var(--line);
      border-radius: 18px;

      background: rgba(2, 11, 17, 0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-main {
      color: var(--cyan);
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-shadow:
        0 0 12px rgba(0, 234, 255, 0.65);
    }

    .brand-sub {
      color: var(--muted);
      font-size: 8px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .clock {
      text-align: center;
      font-size: 13px;
      letter-spacing: 0.12em;
      color: var(--white);
      font-variant-numeric: tabular-nums;
    }

    .connection {
      justify-self: end;
      color: var(--green);
      font-size: 8px;
      letter-spacing: 0.13em;
      text-align: right;
      text-transform: uppercase;
    }

    .connection::before {
      content: "";
      display: inline-block;

      width: 6px;
      height: 6px;

      margin-right: 6px;

      border-radius: 50%;
      background: currentColor;

      box-shadow:
        0 0 8px currentColor;
    }

    /* =========================
       CORE
    ========================== */

    .core-area {
      position: relative;

      min-height: 260px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      border: 1px solid rgba(0, 234, 255, 0.18);
      border-radius: 22px;

      background:
        radial-gradient(
          circle,
          rgba(0, 234, 255, 0.055),
          rgba(0, 0, 0, 0.10) 50%,
          transparent 72%
        );

      box-shadow: var(--shadow);
    }

    .core {
      position: relative;

      width: 185px;
      height: 185px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring {
      position: absolute;
      inset: 0;

      border-radius: 50%;

      border:
        1px solid rgba(0, 234, 255, 0.40);

      box-shadow:
        0 0 20px rgba(0, 234, 255, 0.07),
        inset 0 0 20px rgba(0, 234, 255, 0.04);

      animation: rotate 18s linear infinite;
    }

    .ring:nth-child(2) {
      inset: 12px;

      border-color: rgba(0, 234, 255, 0.22);

      border-left-color: transparent;
      border-right-color: transparent;

      animation:
        rotateReverse 11s linear infinite;
    }

    .ring:nth-child(3) {
      inset: 28px;

      border-color: rgba(0, 234, 255, 0.32);

      border-top-color: transparent;
      border-bottom-color: transparent;

      animation:
        rotate 7s linear infinite;
    }

    .ring::before,
    .ring::after {
      content: "";

      position: absolute;

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--cyan);

      box-shadow:
        0 0 10px var(--cyan),
        0 0 20px var(--cyan);
    }

    .ring::before {
      top: -3px;
      left: 50%;
    }

    .ring::after {
      bottom: -3px;
      right: 20%;
    }

    @keyframes rotate {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes rotateReverse {
      to {
        transform: rotate(-360deg);
      }
    }

    .reactor {
      width: 70px;
      height: 70px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle,
          #dfffff 0%,
          #6df7ff 12%,
          #00eaff 34%,
          rgba(0, 234, 255, 0.25) 55%,
          transparent 72%
        );

      box-shadow:
        0 0 18px rgba(0, 234, 255, 0.8),
        0 0 50px rgba(0, 234, 255, 0.35);

      animation: reactorPulse 2.2s ease-in-out infinite;
    }

    .reactor::after {
      content: "L";
      color: #00151b;
      font-size: 23px;
      font-weight: 900;
      text-shadow: none;
    }

    @keyframes reactorPulse {
      0%,
      100% {
        transform: scale(0.95);
        box-shadow:
          0 0 18px rgba(0, 234, 255, 0.7),
          0 0 45px rgba(0, 234, 255, 0.28);
      }

      50% {
        transform: scale(1.05);
        box-shadow:
          0 0 25px rgba(0, 234, 255, 0.95),
          0 0 65px rgba(0, 234, 255, 0.40);
      }
    }

    .core-label {
      position: absolute;
      bottom: 13px;
      left: 0;
      right: 0;

      text-align: center;

      color: var(--muted);
      font-size: 8px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    /* =========================
       STATUS
    ========================== */

    .status {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 10px 14px;

      border: 1px solid var(--line);
      border-radius: 14px;

      background: var(--panel);

      box-shadow: var(--shadow);
    }

    .status-main {
      color: var(--cyan);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.13em;
    }

    .status-sub {
      color: var(--muted);
      font-size: 8px;
      letter-spacing: 0.12em;
    }

    /* =========================
       CHAT
    ========================== */

    .chat-panel {
      flex: 1;

      min-height: 230px;

      display: flex;
      flex-direction: column;

      overflow: hidden;

      border: 1px solid var(--line);
      border-radius: 18px;

      background:
        linear-gradient(
          180deg,
          rgba(4, 16, 24, 0.80),
          rgba(2, 9, 14, 0.92)
        );

      box-shadow: var(--shadow);
    }

    .chat-header {
      padding: 10px 13px;

      border-bottom:
        1px solid rgba(0, 234, 255, 0.13);

      color: var(--muted);

      font-size: 8px;
      letter-spacing: 0.17em;
      text-transform: uppercase;
    }

    .messages {
      flex: 1;

      overflow-y: auto;

      padding: 12px;

      display: flex;
      flex-direction: column;
      gap: 9px;

      scroll-behavior: smooth;
    }

    .message {
      max-width: 88%;

      padding: 10px 12px;

      border-radius: 13px;

      font-size: 13px;
      line-height: 1.45;

      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.lucen {
      align-self: flex-start;

      color: var(--white);

      border:
        1px solid rgba(0, 234, 255, 0.20);

      background:
        rgba(0, 234, 255, 0.055);

      box-shadow:
        inset 0 0 15px rgba(0, 234, 255, 0.025);
    }

    .message.user {
      align-self: flex-end;

      color: #021016;

      background: var(--cyan);

      box-shadow:
        0 0 18px rgba(0, 234, 255, 0.18);
    }

    .message.system {
      align-self: center;

      color: var(--muted);

      font-size: 10px;
      text-align: center;
    }

    /* =========================
       INPUT
    ========================== */

    .input-area {
      display: flex;
      gap: 8px;

      padding: 10px;

      border-top:
        1px solid rgba(0, 234, 255, 0.13);
    }

    .text-input {
      flex: 1;

      min-width: 0;

      height: 45px;

      padding: 0 13px;

      border:
        1px solid rgba(0, 234, 255, 0.25);

      border-radius: 12px;

      outline: none;

      color: var(--white);

      background:
        rgba(0, 0, 0, 0.28);

      transition: 0.2s ease;
    }

    .text-input::placeholder {
      color: #507783;
    }

    .text-input:focus {
      border-color: var(--cyan);

      box-shadow:
        0 0 16px rgba(0, 234, 255, 0.10);
    }

    .send-button,
    .clear-button {
      width: 45px;
      height: 45px;

      flex: 0 0 45px;

      border-radius: 12px;

      color: var(--cyan);

      background:
        rgba(0, 234, 255, 0.055);

      border:
        1px solid rgba(0, 234, 255, 0.25);

      cursor: pointer;

      transition:
        transform 0.15s ease,
        background 0.15s ease,
        box-shadow 0.15s ease;
    }

    .send-button:active,
    .clear-button:active,
    .voice-button:active {
      transform: scale(0.94);
    }

    .send-button:hover,
    .clear-button:hover {
      background:
        rgba(0, 234, 255, 0.12);

      box-shadow:
        0 0 15px rgba(0, 234, 255, 0.10);
    }

    /* =========================
       CONTROLS
    ========================== */

    .controls {
      display: grid;
      grid-template-columns: 1fr 48px;
      gap: 10px;
    }

    .voice-button {
      position: relative;

      height: 54px;

      border-radius: 15px;

      color: #00151b;

      background:
        linear-gradient(
          135deg,
          #00eaff,
          #7cffff
        );

      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.16em;

      box-shadow:
        0 0 24px rgba(0, 234, 255, 0.18);

      cursor: pointer;

      overflow: hidden;

      transition:
        transform 0.15s ease,
        box-shadow 0.2s ease;
    }

    .voice-button::before {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          110deg,
          transparent 30%,
          rgba(255,255,255,0.45) 50%,
          transparent 70%
        );

      transform: translateX(-120%);

      animation: buttonScan 3.5s infinite;
    }

    @keyframes buttonScan {
      0%,
      45% {
        transform: translateX(-120%);
      }

      65%,
      100% {
        transform: translateX(120%);
      }
    }

    .voice-button.active {
      color: white;

      background:
        linear-gradient(
          135deg,
          #ff315b,
          #ff6986
        );

      box-shadow:
        0 0 30px rgba(255, 49, 91, 0.35);

      animation: voiceActive 1.1s ease-in-out infinite;
    }

    @keyframes voiceActive {
      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.015);
      }
    }

    .clear-button {
      width: 48px;
      height: 54px;

      font-size: 18px;
    }

    /* =========================
       TELEMETRY
    ========================== */

    .telemetry {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .telemetry-card {
      min-height: 45px;

      display: flex;
      flex-direction: column;
      justify-content: center;

      padding: 7px 9px;

      border:
        1px solid rgba(0, 234, 255, 0.13);

      border-radius: 12px;

      background:
        rgba(2, 10, 15, 0.65);
    }

    .telemetry-label {
      color: #507783;

      font-size: 7px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .telemetry-value {
      margin-top: 3px;

      color: var(--cyan);

      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* =========================
       ERROR
    ========================== */

    .app.error .core {
      filter: saturate(0.7);
    }

    .app.error .reactor {
      background:
        radial-gradient(
          circle,
          #ffffff 0%,
          #ff7890 12%,
          #ff315b 34%,
          rgba(255, 49, 91, 0.2) 55%,
          transparent 72%
        );

      box-shadow:
        0 0 20px rgba(255, 49, 91, 0.8),
        0 0 55px rgba(255, 49, 91, 0.3);
    }

    /* =========================
       DESKTOP
    ========================== */

    @media (min-width: 700px) {
      .app {
        max-width: 760px;
        margin: 0 auto;
        padding-left: 22px;
        padding-right: 22px;
      }

      .core-area {
        min-height: 300px;
      }

      .core {
        width: 220px;
        height: 220px;
      }

      .reactor {
        width: 82px;
        height: 82px;
      }
    }
  </style>
</head>

<body>

  <div class="background">
    <div class="grid"></div>
    <div class="scanline"></div>
    <div class="glow"></div>
  </div>

  <main class="app" id="app">

    <!-- TOP -->
    <header class="topbar">

      <div class="brand">
        <div class="brand-main">
          LUCEN
        </div>

        <div class="brand-sub">
          Personal Intelligence System
        </div>
      </div>

      <div class="clock" id="clock">
        --:--
      </div>

      <div
        class="connection"
        id="connection"
      >
        LUCEN CORE ONLINE
      </div>

    </header>

    <!-- CORE -->
    <section class="core-area">

      <div class="core">

        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>

        <div class="reactor"></div>

      </div>

      <div class="core-label">
        NEURAL CORE // ACTIVE
      </div>

    </section>

    <!-- STATUS -->
    <section class="status">

      <div>
        <div
          class="status-main"
          id="statusMain"
        >
          LUCEN ONLINE
        </div>

        <div
          class="status-sub"
          id="statusSub"
        >
          READY
        </div>
      </div>

      <div
        class="status-sub"
        id="voiceState"
      >
        VOICE STANDBY
      </div>

    </section>

    <!-- CHAT -->
    <section class="chat-panel">

      <div class="chat-header">
        LUCEN CONVERSATION CORE
      </div>

      <div
        class="messages"
        id="messages"
      >

        <div class="message lucen">
          LUCEN online. Wie kann ich dir helfen?
        </div>

      </div>

      <form
        class="input-area"
        id="textForm"
      >

        <input
          id="textInput"
          class="text-input"
          type="text"
          autocomplete="off"
          placeholder="Nachricht an LUCEN..."
        >

        <button
          class="send-button"
          type="submit"
          aria-label="Senden"
        >
          ➤
        </button>

      </form>

    </section>

    <!-- CONTROLS -->
    <section class="controls">

      <button
        class="voice-button"
        id="voiceButton"
        type="button"
      >
        <span id="voiceButtonText">
          VOICE AKTIVIEREN
        </span>
      </button>

      <button
        class="clear-button"
        id="clearButton"
        type="button"
        aria-label="Chat löschen"
      >
        ×
      </button>

    </section>

    <!-- TELEMETRY -->
    <section class="telemetry">

      <div class="telemetry-card">

        <div class="telemetry-label">
          CORE
        </div>

        <div
          class="telemetry-value"
          id="coreTelemetry"
        >
          ONLINE
        </div>

      </div>

      <div class="telemetry-card">

        <div class="telemetry-label">
          NETWORK
        </div>

        <div
          class="telemetry-value"
          id="networkTelemetry"
        >
          SECURE
        </div>

      </div>

      <div class="telemetry-card">

        <div class="telemetry-label">
          MODE
        </div>

        <div
          class="telemetry-value"
          id="modeTelemetry"
        >
          READY
        </div>

      </div>

    </section>

  </main>

  <!-- Remote audio for Realtime -->
  <audio
    id="remoteAudio"
    autoplay
    playsinline
  ></audio>

  <script type="module">

    /* =========================================================
       LUCEN FRONTEND CORE
       ========================================================= */

    const app =
      document.getElementById("app");

    const clock =
      document.getElementById("clock");

    const connection =
      document.getElementById("connection");

    const statusMain =
      document.getElementById("statusMain");

    const statusSub =
      document.getElementById("statusSub");

    const voiceState =
      document.getElementById("voiceState");

    const messages =
      document.getElementById("messages");

    const textForm =
      document.getElementById("textForm");

    const textInput =
      document.getElementById("textInput");

    const voiceButton =
      document.getElementById("voiceButton");

    const voiceButtonText =
      document.getElementById("voiceButtonText");

    const clearButton =
      document.getElementById("clearButton");

    const coreTelemetry =
      document.getElementById("coreTelemetry");

    const networkTelemetry =
      document.getElementById("networkTelemetry");

    const modeTelemetry =
      document.getElementById("modeTelemetry");

    const remoteAudio =
      document.getElementById("remoteAudio");


    /* =========================================================
       STATE
       ========================================================= */

    let voiceActive = false;

    let conversationStarted = false;

    let peerConnection = null;

    let dataChannel = null;

    let localStream = null;


    /* =========================================================
       CLOCK
       ========================================================= */

    function updateClock() {

      const now =
        new Date();

      clock.textContent =
        now.toLocaleTimeString(
          "de-DE",
          {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
          }
        );

    }

    updateClock();

    setInterval(
      updateClock,
      1000
    );


    /* =========================================================
       STATUS
       ========================================================= */

    function setStatus(
      main,
      sub
    ) {

      statusMain.textContent =
        main;

      statusSub.textContent =
        sub;

    }


    /* =========================================================
       MESSAGE
       ========================================================= */

    function addMessage(
      type,
      text
    ) {

      const message =
        document.createElement("div");

      message.className =
        `message ${type}`;

      message.textContent =
        text;

      messages.appendChild(
        message
      );

      messages.scrollTop =
        messages.scrollHeight;

    }


    /* =========================================================
       TEXT CHAT → LUCEN V2
       ========================================================= */

    textForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        const message =
          textInput.value.trim();

        if (!message) {
          return;
        }

        textInput.value = "";

        addMessage(
          "user",
          message
        );

        setStatus(
          "THINKING",
          "LUCEN CORE VERARBEITET"
        );

        connection.textContent =
          "CORE PROCESSING";

        connection.style.color =
          "var(--cyan)";

        coreTelemetry.textContent =
          "PROCESSING";

        modeTelemetry.textContent =
          "THINKING";

        try {

          const response =
            await fetch(
              "/.netlify/functions/lucen-v2",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({

                  message,

                  context: {
                    source:
                      "lucen-interface",

                    language:
                      "de",

                    voiceActive,

                    conversationStarted,

                    timestamp:
                      new Date().toISOString()
                  }

                })
              }
            );


          let data;

          try {

            data =
              await response.json();

          } catch {

            throw new Error(
              "Ungültige Antwort vom LUCEN-Core."
            );

          }


          console.log(
            "LUCEN CORE RESPONSE:",
            data
          );


          if (
            !response.ok ||
            data.ok === false
          ) {

            throw new Error(
              data.error ||
              "LUCEN Core nicht erreichbar."
            );

          }


          let reply =
            data.reply;


          if (
            !reply &&
            data.result
          ) {

            reply =
              data.result.reply ||
              data.result.answer ||
              data.result.message;

          }


          if (!reply) {

            switch (data.type) {

              case "memory":

                reply =
                  "Verstanden. Ich habe die Information verarbeitet.";

                break;


              case "task":

                reply =
                  "Die Aufgabe wurde verarbeitet.";

                break;


              case "research":

                reply =
                  data.result?.answer ||
                  "Die Recherche wurde abgeschlossen.";

                break;


              case "calculation":

                reply =
                  data.result?.result !== undefined
                    ? String(
                        data.result.result
                      )
                    : "Die Berechnung wurde durchgeführt.";

                break;


              case "calendar":

                reply =
                  "Der Kalendereintrag wurde vorbereitet.";

                break;


              case "reminder":

                reply =
                  "Die Erinnerung wurde vorbereitet.";

                break;


              case "document":

                reply =
                  "Das Dokument wurde vorbereitet.";

                break;


              case "notification":

                reply =
                  "Die Benachrichtigung wurde vorbereitet.";

                break;


              case "navigation":

                reply =
                  "Die Navigation wurde vorbereitet.";

                break;


              default:

                reply =
                  "Verstanden.";

            }

          }


          addMessage(
            "lucen",
            reply
          );


          connection.textContent =
            "LUCEN CORE ONLINE";

          connection.style.color =
            "var(--green)";


          coreTelemetry.textContent =
            "ONLINE";

          networkTelemetry.textContent =
            "SECURE";

          modeTelemetry.textContent =
            "READY";


          setStatus(
            "LUCEN ONLINE",
            "READY"
          );


          app.classList.remove(
            "error"
          );


          conversationStarted =
            true;


        } catch (error) {

          console.error(
            "LUCEN CORE ERROR:",
            error
          );


          addMessage(
            "lucen",
            "Die Verbindung zum LUCEN-Core ist momentan nicht verfügbar."
          );


          connection.textContent =
            "CORE ERROR";

          connection.style.color =
            "var(--danger)";


          coreTelemetry.textContent =
            "ERROR";

          modeTelemetry.textContent =
            "OFFLINE";


          setStatus(
            "CONNECTION ERROR",
            "CORE NICHT VERFÜGBAR"
          );


          app.classList.add(
            "error"
          );

        }

      }
    );


    /* =========================================================
       CLEAR CHAT
       ========================================================= */

    clearButton.addEventListener(
      "click",
      () => {

        messages.innerHTML = "";

        addMessage(
          "system",
          "Conversation buffer cleared."
        );

        setStatus(
          "LUCEN ONLINE",
          "READY"
        );

        modeTelemetry.textContent =
          "READY";

      }
    );


    /* =========================================================
       VOICE
       ========================================================= */

    voiceButton.addEventListener(
      "click",
      async () => {

        if (voiceActive) {

          stopVoice();

          return;

        }

        await startVoice();

      }
    );


    /* =========================================================
       START VOICE
       ========================================================= */

    async function startVoice() {

      try {

        setStatus(
          "VOICE STARTING",
          "MICROPHONE WIRD AKTIVIERT"
        );

        voiceState.textContent =
          "MIC INITIALIZING";

        modeTelemetry.textContent =
          "VOICE";

        connection.textContent =
          "VOICE CONNECTING";

        connection.style.color =
          "var(--cyan)";


        localStream =
          await navigator.mediaDevices.getUserMedia(
            {
              audio: true
            }
          );


        peerConnection =
          new RTCPeerConnection();


        peerConnection.ontrack =
          (event) => {

            if (
              event.streams &&
              event.streams[0]
            ) {

              remoteAudio.srcObject =
                event.streams[0];

              remoteAudio
                .play()
                .catch(
                  () => {}
                );

            }

          };


        peerConnection.onconnectionstatechange =
          () => {

            const state =
              peerConnection.connectionState;

            console.log(
              "Realtime connection:",
              state
            );


            if (
              state === "connected"
            ) {

              voiceActive =
                true;

              voiceButton.classList.add(
                "active"
              );

              voiceButtonText.textContent =
                "VOICE AKTIV";

              voiceState.textContent =
                "LISTENING";

              connection.textContent =
                "VOICE ONLINE";

              connection.style.color =
                "var(--green)";

              setStatus(
                "LUCEN LISTENING",
                "SPRICH MIT MIR"
              );

              coreTelemetry.textContent =
                "ONLINE";

              networkTelemetry.textContent =
                "REALTIME";

              modeTelemetry.textContent =
                "VOICE";

            }


            if (
              state === "failed" ||
              state === "disconnected" ||
              state === "closed"
            ) {

              if (voiceActive) {
                stopVoice();
              }

            }

          };


        localStream
          .getTracks()
          .forEach(
            (track) => {

              peerConnection.addTrack(
                track,
                localStream
              );

            }
          );


        dataChannel =
          peerConnection.createDataChannel(
            "oai-events"
          );


        dataChannel.onopen =
          () => {

            console.log(
              "Realtime data channel online."
            );

          };


        dataChannel.onmessage =
          (event) => {

            try {

              const data =
                JSON.parse(
                  event.data
                );

              console.log(
                "Realtime event:",
                data
              );

            } catch {

              console.log(
                "Realtime message:",
                event.data
              );

            }

          };


        const offer =
          await peerConnection.createOffer();


        await peerConnection.setLocalDescription(
          offer
        );


        await waitForIceGatheringComplete(
          peerConnection
        );


        const localDescription =
          peerConnection.localDescription;


        const response =
          await fetch(
            "/.netlify/functions/realtime",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/sdp"
              },

              body:
                localDescription.sdp
            }
          );


        if (!response.ok) {

          const errorText =
            await response.text();

          throw new Error(
            errorText ||
            "Realtime Verbindung fehlgeschlagen."
          );

        }


        const answerSdp =
          await response.text();


        await peerConnection.setRemoteDescription(
          {
            type: "answer",
            sdp: answerSdp
          }
        );


        conversationStarted =
          true;


      } catch (error) {

        console.error(
          "VOICE ERROR:",
          error
        );


        addMessage(
          "system",
          "Voice konnte nicht gestartet werden."
        );


        connection.textContent =
          "VOICE ERROR";

        connection.style.color =
          "var(--danger)";


        voiceState.textContent =
          "VOICE OFFLINE";

        modeTelemetry.textContent =
          "ERROR";


        setStatus(
          "VOICE FEHLER",
          "MIKROFON / VERBINDUNG PRÜFEN"
        );


        app.classList.add(
          "error"
        );


        stopVoice();

      }

    }


    /* =========================================================
       ICE WAIT
       ========================================================= */

    function waitForIceGatheringComplete(
      pc
    ) {

      return new Promise(
        (resolve) => {

          if (
            pc.iceGatheringState ===
            "complete"
          ) {

            resolve();

            return;

          }


          const checkState =
            () => {

              if (
                pc.iceGatheringState ===
                "complete"
              ) {

                pc.removeEventListener(
                  "icegatheringstatechange",
                  checkState
                );

                resolve();

              }

            };


          pc.addEventListener(
            "icegatheringstatechange",
            checkState
          );

        }
      );

    }


    /* =========================================================
       STOP VOICE
       ========================================================= */

    function stopVoice() {

      voiceActive =
        false;


      if (dataChannel) {

        try {
          dataChannel.close();
        } catch {}

        dataChannel =
          null;

      }


      if (peerConnection) {

        try {
          peerConnection.close();
        } catch {}

        peerConnection =
          null;

      }


      if (localStream) {

        localStream
          .getTracks()
          .forEach(
            (track) => {

              try {
                track.stop();
              } catch {}

            }
          );

        localStream =
          null;

      }


      remoteAudio.srcObject =
        null;


      voiceButton.classList.remove(
        "active"
      );

      voiceButtonText.textContent =
        "VOICE AKTIVIEREN";


      voiceState.textContent =
        "VOICE STANDBY";


      connection.textContent =
        "LUCEN CORE ONLINE";

      connection.style.color =
        "var(--green)";


      setStatus(
        "LUCEN ONLINE",
        "READY"
      );


      modeTelemetry.textContent =
        "READY";


      app.classList.remove(
        "error"
      );

    }


    /* =========================================================
       INITIAL STATE
       ========================================================= */

    connection.textContent =
      "LUCEN CORE ONLINE";

    connection.style.color =
      "var(--green)";

    coreTelemetry.textContent =
      "ONLINE";

    networkTelemetry.textContent =
      "SECURE";

    modeTelemetry.textContent =
      "READY";


    /* =========================================================
       PREVENT ZOOM / DOUBLE TAP ISSUES
       ========================================================= */

    let lastTouchEnd =
      0;

    document.addEventListener(
      "touchend",
      (event) => {

        const now =
          Date.now();

        if (
          now - lastTouchEnd <= 300
        ) {

          event.preventDefault();

        }

        lastTouchEnd =
          now;

      },
      {
        passive: false
      }
    );

  </script>

</body>
